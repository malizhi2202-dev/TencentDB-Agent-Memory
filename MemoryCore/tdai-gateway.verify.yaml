# 验证专用配置：新端口 8430 + 独立数据目录，与 8420/8096 完全隔离。
deployMode: standalone
stateBackend: "local"

server:
  port: 8430
  host: "127.0.0.1"

data:
  baseDir: "/tmp/tdai-gateway-verify"

llm:
  baseUrl: "https://api.360.cn/v1"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "deepseek/deepseek-v4-flash-internal"
  maxTokens: 4096
  timeoutMs: 120000

memory:
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000
  storeBackend: "sqlite"
  embedding:
    provider: "none"
  bm25:
    enabled: true
    language: "zh"

skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false
