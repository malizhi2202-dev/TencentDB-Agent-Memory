<script>
// 主题切换：纯本地，写入 localStorage，不发请求
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var label = document.getElementById('theme-label');
  var stored = null;
  try { stored = localStorage.getItem('eam-theme'); } catch (e) {}
  function apply(t){
    root.setAttribute('data-theme', t);
    if (label) label.textContent = (t === 'dark') ? '亮色' : '暗色';
    if (btn) btn.setAttribute('aria-label', (t === 'dark') ? '切换到亮色主题' : '切换到暗色主题');
  }
  apply(stored === 'dark' ? 'dark' : 'light');
  if (btn) btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('eam-theme', next); } catch (e) {}
  });
})();
</script>
