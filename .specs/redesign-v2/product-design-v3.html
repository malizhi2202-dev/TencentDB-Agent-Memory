let state={mode:'docs',page:'start',id:'',tab:'',scope:'all',role:'manager',view:'normal',q:'',filter:'all',pageNo:1};let toastTimer,originFocus=null;const initialData=JSON.stringify(data);const docsSections=[{"id":"start","label":"0 · 阅读指南与原型入口","html":"<div class=\"doc-hero\"><span class=\"badge blue\">产品设计文档 & 界面原型 · V3</span><h1 class=\"space\">让任务、知识和执行<br>在同一个工作现场连接起来。</h1><p class=\"muted\">TencentDB Agent Memory 的产品重设计：保留既有能力与控制台风格，以项目为入口，串联 Agent 装配、记忆来源、运行与治理。</p><div class=\"actions\"><a class=\"btn primary\" href=\"#/app/home\">进入交互原型 →</a><a class=\"btn\" href=\"#/app/project/p-db/overview\">从项目开始体验</a><a class=\"btn\" href=\"product-prototype.html\">查看保留的旧版</a></div></div><h2>0 · 这份文档怎么读</h2><div class=\"grid g2\"><section class=\"card\"><h3>按目的阅读</h3><ol><li>了解产品：定位 → 核心概念 → 架构。</li><li>上手操作：模块指南 → 对应原型入口。</li><li>研发落地：契约 → 分期 → 验收。</li><li>安全评审：范围、权限、审批与故障恢复。</li></ol></section><section class=\"card\"><h3>三条阅读约定</h3><ul><li>所有界面数据均为虚构，零后端请求。</li><li>标明已有、恢复、待契约、目标态与新增建议。</li><li>模拟变更仅在内存中有效，刷新即恢复。</li></ul></section></div><h2>推荐体验路径</h2><div class=\"flow\"><a class=\"flow-box\" href=\"#/app/project/p-db/overview\">1 · 项目工作区</a><span class=\"arrow\">→</span><a class=\"flow-box\" href=\"#/app/task/t-104/overview\">2 · 任务与计划</a><span class=\"arrow\">→</span><a class=\"flow-box\" href=\"#/app/run/run-83/context\">3 · 生效上下文</a><span class=\"arrow\">→</span><a class=\"flow-box\" href=\"#/app/governance/_/approvals\">4 · 审批与审计</a></div><h2>关于这次重新设计</h2><p>保留腾讯蓝、14px 高密度信息、轻边框与三段式详情页。不把全部功能继续平铺：全局导航定位工作域，项目内聚合上下文，右侧抽屉用于引用与关系追溯。专业 Wiki、Code、Skill 工作台保留独立入口。</p><p>文档结构参考指定的 logsearch 产品设计文档（阅读指南、全景、概念、架构、时序、使用指南、原型与附录）；领域与能力依据本仓库 V1 / V2 规格及现有代码，不照搬参考产品的业务。</p>"},{"id":"chapter-1","label":"阅读方式与事实口径","html":"<h2>0. 阅读方式与事实口径</h2>\n<ul>\n<li>第一次了解产品：读 §1 定位、§2 核心概念、§3 布局，再从原型工作台进入一个项目。</li>\n<li>业务用户：直接读 §5 首次使用和 §6 逐模块指南；不需要先理解部署、数据库或算法参数。</li>\n<li>研发与测试：读 §4 架构、§7 交互、§8 权限、§9 状态、§10 契约与 §12 验收。</li>\n<li>评审人：重点检查“为什么这样组织”“哪些依赖后端”“旧能力如何保留”；证据索引见 §13。</li>\n<li><code>现存-可复用</code>：已检查到相关源码/调用；<code>恢复</code>：历史材料提出恢复且当前仍有底层入口；<code>待契约</code>：需要读模型、权限或命令补齐；<code>目标态</code>：设计体验；<code>建议</code>：尚未进入承诺范围。</li>\n<li>本文所有未明确标注为现状的交互、状态机、接口扩展、性能门槛均为<strong>目标规格</strong>；原型数据、图表、表单结果与审批决策均为演示，不证明后台能力已完成。</li>\n<li>V1/V2 是历史设计意图，不继承其完成度；遇到冲突，以本轮源码证据说明差异，不在本轮修改历史材料。</li>\n</ul>\n<h3>0.1 配套原型的模拟范围与实现边界</h3>\n<ul>\n<li>配套 HTML 的交互范围为 24 个 page key、66 个页面与 Tab 视图、跨对象抽屉、筛选分页、8 种演示状态、角色切换与明暗主题；默认进入文档模式，按本文二级标题组织章节。</li>\n<li>create task、remember、correct、archive、approve、reject 仅修改浏览器内的演示状态；archive 不删除真实文件或数据，刷新/重置后的持久性以原型说明为准。</li>\n<li>策略、默认模板、API Key 与成员邀请仅提供<strong>预览及演示审计</strong>，不会配置真实服务、创建密钥或发送邀请；本文后续描述的正式提交、验权和持久化均是未来实现规格。</li>\n<li>Graph 为示例关系图，不是完整图谱引擎；Analytics 使用固定虚构指标，筛选交互不证明存在实时查询；列表中的样本 Run 不是完整的 128 条运行明细，汇总与可浏览样本需分别标识。</li>\n<li>文档、架构图和时序图以内嵌内容、离线示意图或 Mermaid 源码承载，不要求访问外部渲染服务；原型角色切换与审计条目只帮助评审体验，不等于生产鉴权或不可篡改审计。</li>\n<li>这些是原型范围约定，不是本 Markdown 编辑任务对 HTML 浏览器测试的通过声明；最终实际可交互范围以主交付方的测试证据为准。</li>\n</ul>\n"},{"id":"chapter-2","label":"产品全景：帮团队把执行经验变成可信的共享记忆","html":"<h2>1. 产品全景：帮团队把执行经验变成可信的共享记忆</h2>\n<h3>1.1 定位、问题与边界</h3>\n<p>TencentDB Agent Memory 是面向团队协作 Agent 的记忆与知识控制面：<strong>Project 是工作现场，Task 是目标，Agent 是执行主体，MemorySpace 是记忆归属与策略边界，Run 是执行事实。</strong> 用户能从任务找到运行、从运行找到本轮上下文、从记忆回溯来源，再由审批、审计和评测判断是否应长期复用。\n当前问题不是缺少更多菜单，而是已有对象被分散在资源页和团队详情中：用户难以回答“下一步做什么”“这个 Agent 为什么记得这件事”“更改会影响谁”。Agent 与空间详情仍有占位，不能靠换导航解决。[E1–E4]\n本次设计优先连通“选择项目 → 明确任务 → 检查 Agent 装配 → 查看运行 → 评审交付 → 沉淀记忆”，并保留 Wiki、Code、Skill、Chat Memory 的专业操作。\n<strong>不做</strong>通用 Agent OS、另建 Scene/Flow 重型运行时、替换现有执行器、重写检索算法、把本地试调包装为生产业务；也不把原型做成真实管理后台。</p>\n<h3>1.2 用户、工作动机与入口</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>用户角色</th>\n<th>要完成的工作</th>\n<th>当前痛点 / 频率假设</th>\n<th>首要入口与完成证据</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>项目负责人</td>\n<td>分配任务、判断阻塞、验收交付</td>\n<td>每日查看，多页拼上下文</td>\n<td>Project → Task；交付评审与状态变更有记录</td>\n</tr>\n<tr>\n<td>项目成员 / Agent 使用者</td>\n<td>找到可信知识，让 Agent 完成具体任务</td>\n<td>高频使用，不知道资产是否真正注入</td>\n<td>Task、Agent、Memory；Run 能解释实际使用版本</td>\n</tr>\n<tr>\n<td>知识维护者</td>\n<td>导入资料、纠正过期结论、复用 Skill</td>\n<td>每周或知识变更时；担心误覆盖</td>\n<td>Assets、Wiki、Code、Skill、Memory；有来源和版本</td>\n</tr>\n<tr>\n<td>Reviewer / 安全审阅者</td>\n<td>决定风险写入，回溯异常</td>\n<td>事件触发；缺少审批影响上下文</td>\n<td>Governance；决策理由、操作者和副作用结果可追溯</td>\n</tr>\n<tr>\n<td>平台管理员</td>\n<td>管成员、密钥、模型连接与线上用量</td>\n<td>配置变更 / 排障时；管理入口隐蔽</td>\n<td>Team、Settings、Analytics；权限与连接状态可解释</td>\n</tr>\n</tbody></table></div>\n<p>以上频率为设计假设，未进行用户访谈或线上埋点分析；不得把角色画像写成已验证的用户研究。</p>\n<h3>1.3 能力地图与目标指标</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>工作域</th>\n<th>能力与对象</th>\n<th>用户收益</th>\n<th>建议验收目标（尚无基线）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>工作</td>\n<td>Home / Project / Task</td>\n<td>找到需处理事项而非阅读全量统计</td>\n<td>首次使用者 5 分钟内找到一个阻塞任务及原因</td>\n</tr>\n<tr>\n<td>协作</td>\n<td>Agent / Orchestration / Run</td>\n<td>区分配置意图与执行证据</td>\n<td>从任务到本轮上下文不超过 3 次对象跳转</td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td>Memory / Space / Asset / Wiki / Code / Skill</td>\n<td>复用有出处的知识，纠错可控</td>\n<td>详情中来源、范围、版本、状态缺失时明确说明</td>\n</tr>\n<tr>\n<td>治理</td>\n<td>Approval / Permissions / Audit / Eval</td>\n<td>风险动作有人审、出了问题可追</td>\n<td>越权详情与存在性计数泄露均为 0</td>\n</tr>\n<tr>\n<td>组织与观测</td>\n<td>Team / Settings / Analytics</td>\n<td>配置可管理，线上问题可定位</td>\n<td>未配置、无权限、无数据三类反馈可明确区分</td>\n</tr>\n</tbody></table></div>\n<p>测量采用固定脚本的可用性走查、权限负例与请求记录；不能用演示数据算业务转化率。上线后再建立任务完成耗时、审批等待时间、检索有用率与失败定位耗时基线。</p>\n"},{"id":"concepts","label":"核心概念与对象关系","html":"<h2>2. 核心概念与对象关系</h2>\n<h3>2.1 对象字典：归属、配置、事实分开</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>对象</th>\n<th>是什么 / 关键字段</th>\n<th>与其他对象的关系及设计边界</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Team 团队</td>\n<td>组织归属与公共资产池，<code>team_id</code></td>\n<td>不等于 Project；团队成员与项目成员分别授权</td>\n</tr>\n<tr>\n<td>Project 项目</td>\n<td>持续协作现场，名称、owner、visibility、代码锚点</td>\n<td>一个主 Team，成员可跨 Team；汇集任务、Agent、资产与知识条目</td>\n</tr>\n<tr>\n<td>Task 任务</td>\n<td>可验收的工作目标，目标、负责人、状态、风险、完成条件</td>\n<td>可归入 Project；声明 Agent 与实际参与者分开；一次任务可有多次 Run</td>\n</tr>\n<tr>\n<td>Agent</td>\n<td>有 owner 的执行配置，prompt、模型引用、资产装配</td>\n<td>当前 <code>project_id</code> 单值；多项目关系是目标态，首期表单不承诺多选</td>\n</tr>\n<tr>\n<td>AgentTeam / Automation</td>\n<td>Agent 协作组 / 触发配置</td>\n<td>属于编排，不是组织 Team；现有配置 CRUD 不等于已具备完整调度控制台</td>\n</tr>\n<tr>\n<td>Asset 资产</td>\n<td>可复用知识/能力入口，类型、版本、owner、visibility、内容引用</td>\n<td>当前类型 <code>skill / llm_wiki / code_graph / chat_memory</code>；统一目录不合并专属编辑器</td>\n</tr>\n<tr>\n<td>MemorySpace 记忆空间</td>\n<td><code>(ownerType, ownerId, domain)</code> 的容器及策略基线</td>\n<td>owner 可为 user/team/project/agent/task；挂载关系与空间本体不能混为一行</td>\n</tr>\n<tr>\n<td>Memory 记忆</td>\n<td>可检索的事实、偏好、方法、任务或产出描述</td>\n<td>有来源、scope、版本和生命周期；不是所有 Asset 的统称</td>\n</tr>\n<tr>\n<td>Run 运行</td>\n<td>某次执行尝试及当时事实，agent/task、状态、时间、bundle</td>\n<td>当前 RunTrace 以摘要和 <code>trace_json</code> 为主；不可推断已存结构化事件与完整快照</td>\n</tr>\n<tr>\n<td>Artifact / KnowledgeEntry</td>\n<td>交付物 / 决策、规范等协作知识</td>\n<td>交付不自动等于 Asset；先评审，再显式生成记忆或资产候选</td>\n</tr>\n<tr>\n<td>Approval / Audit / Eval</td>\n<td>风险决策 / 操作证据 / 质量比较</td>\n<td>审批通过不代表执行成功；审计不是聊天；评测不是实时用量图</td>\n</tr>\n</tbody></table></div>\n<h3>2.2 可访问 ≠ 固定装配 ≠ 本轮生效</h3>\n<ol>\n<li><strong>可访问 accessible</strong>：当前主体在指定上下文下被允许读取/使用的候选集，由身份、归属、visibility、ACL 共同决定；<code>read</code> 与 <code>use</code> 权限也要区分。</li>\n<li><strong>固定装配 mounted / fixed</strong>：Agent 默认携带的资产与挂载空间，是配置意图；移除装配不删除资产，不撤销他人的权限。</li>\n<li><strong>本轮生效 effective</strong>：特定 Run 经 scope、版本、策略、任务选择和预算解析后的有效上下文；必须显示 <code>runId / bundleId / resolvedAt</code>，无 Run 时显示“尚无运行快照”。</li>\n<li>生效不能被简化为固定装配的子集：Task 临时选择、Project 默认来源也可能进入执行包；固定装配可能因权限撤销、版本过期或策略而未生效。服务端授权是所有路径的必要条件。</li>\n<li>“进入执行包”“获得召回候选资格”“被检索命中”“正文实际注入”再分标签；Skill 仅注入索引时，不能写成正文已读。没有遥测只能显示“未记录”，不能显示“未使用”。</li>\n<li>当前 <code>assetsApi.listAccessible</code> 查询的是当前用户可访问集合，<code>agent_id</code> 参数还会筛固定绑定；不能直接把它当 Agent 的完整候选权限判定。目标 Agent 读模型需显式区分 <code>viewer</code> 与 <code>subjectAgent</code>。[E5]</li>\n</ol>\n<h3>2.3 记忆的四个独立维度</h3>\n<ul>\n<li><strong>层级</strong>：沿用界面术语 L0 对话原文、L1 原子记忆、L2 场景记忆、L3 核心记忆；层级不是权限级别，也不保证高层永远更可信。[E14]</li>\n<li><strong>内容域 domain</strong>：例如 semantic、procedural、preference、instruction、rule；空间以域表达内容侧重，不能从 domain 推断调用者拥有权限。</li>\n<li><strong>范围 scope</strong>：谁拥有、谁可访问、在哪个项目/任务使用；筛选范围是用户查看条件，不是给服务端追加授权。</li>\n<li><strong>写策略</strong>：<code>automatic</code> 允许系统总结写入；<code>review_required</code> 先审后写；<code>explicit_only</code> 只接受有权用户的明确写入意图，自动提炼不能借审批绕过；<code>deny</code> 拒绝。当前规则已有纯逻辑依据。[E10]</li>\n<li><strong>纠错语义</strong>：目标采用新版本替代旧版本并保留 <code>supersededBy</code>；“忘记”默认为归档、停止未来召回，不承诺擦除已生成的历史输出。硬删除另走合规方案，本原型不提供真实删除。</li>\n</ul>\n<h3>2.4 目标关系图（不代表迁移已经落库）</h3>\n<div class=\"table-wrap diagram\" aria-label=\"领域关系图\"><svg id=\"diagram-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"erDiagram\" style=\"max-width: 2297.88671875px;\" viewBox=\"0 0 2297.88671875 841\" role=\"graphics-document document\" aria-roledescription=\"er\"><style>#diagram-0{font-family:Arial,Microsoft YaHei,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-0 .error-icon{fill:#552222;}#diagram-0 .error-text{fill:#552222;stroke:#552222;}#diagram-0 .edge-thickness-normal{stroke-width:1px;}#diagram-0 .edge-thickness-thick{stroke-width:3.5px;}#diagram-0 .edge-pattern-solid{stroke-dasharray:0;}#diagram-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-0 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-0 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-0 .marker{fill:#666;stroke:#666;}#diagram-0 .marker.cross{stroke:#666;}#diagram-0 svg{font-family:Arial,Microsoft YaHei,sans-serif;font-size:16px;}#diagram-0 p{margin:0;}#diagram-0 .entityBox{fill:#eee;stroke:#999;}#diagram-0 .relationshipLabelBox{fill:hsl(-160, 0%, 93.3333333333%);opa _BUNDLE : snapshots\n  RUN ||--o{ ARTIFACT : produces\n  RUN o|--o{ APPROVAL : gated_by\n  MEMORY ||--o{ MEMORY_VERSION : versions\n</pre></details>\n<p>图中多项目关系、结构化 Artifact、运行快照是目标；历史 Run 可以没有 Task、Agent 或快照。Memory 来源需允许 Conversation/Message/Task/Run 引用，缺失来源的旧记录保留“历史来源未记录”，不得补造关联。</p>\n"},{"id":"layout","label":"信息架构与页面布局","html":"<h2>3. 信息架构与页面布局</h2>\n<h3>3.1 导航原则与完整路由清单</h3>\n<p>侧栏按工作心智分组，一级入口保留可发现性，详情不占一级菜单。以下为<strong>原型 route key</strong>，不是现有业务 API；未来生产 URL 的实体 ID 不由页面标题生成。</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>分组</th>\n<th>原型路由</th>\n<th>页面职责 / 二级 Tab</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>工作</td>\n<td><code>home</code></td>\n<td>工作台：待处理、最近项目/任务、运行异常</td>\n</tr>\n<tr>\n<td>工作</td>\n<td><code>projects</code> → <code>project</code></td>\n<td>项目列表 → <code>overview / tasks / agents / assets / memory / activity / runs / settings</code></td>\n</tr>\n<tr>\n<td>工作</td>\n<td><code>tasks</code> → <code>task</code></td>\n<td>全局任务列表 → <code>overview / plan / runs / artifacts</code></td>\n</tr>\n<tr>\n<td>协作</td>\n<td><code>agents</code> → <code>agent</code></td>\n<td>Agent 列表 → <code>overview / projects / assembly / memory / runs / policy / versions</code></td>\n</tr>\n<tr>\n<td>协作</td>\n<td><code>orchestration</code></td>\n<td>Agent 编排：协作组、成员、自动化触发配置</td>\n</tr>\n<tr>\n<td>协作</td>\n<td><code>runs</code> → <code>run</code></td>\n<td>运行列表 → <code>timeline / context / tools / artifacts</code></td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td><code>memory</code></td>\n<td>跨来源记忆浏览、检索试调、显式管理</td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td><code>spaces</code> → <code>space</code></td>\n<td>空间列表 → <code>overview / memories / mounts / policy</code></td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td><code>assets</code> → <code>asset</code></td>\n<td>统一资产目录 → 元数据、权限、装配引用、专业入口</td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td><code>wiki</code> / <code>code</code> / <code>analysis</code></td>\n<td>Wiki 内容工作台 / Code 来源管理 / 代码分析与图谱</td>\n</tr>\n<tr>\n<td>知识与记忆</td>\n<td><code>skills</code> → <code>skill</code></td>\n<td>Skill 目录 → 正文、版本、来源与使用关系</td>\n</tr>\n<tr>\n<td>治理</td>\n<td><code>governance</code></td>\n<td><code>approvals / permissions / audit / evals</code></td>\n</tr>\n<tr>\n<td>治理</td>\n<td><code>analytics</code></td>\n<td>线上调用情况：调用概况、模型用量；不是代码分析</td>\n</tr>\n<tr>\n<td>组织</td>\n<td><code>team</code></td>\n<td>团队归属、成员摘要、工作规范及管理入口</td>\n</tr>\n<tr>\n<td>组织</td>\n<td><code>settings</code></td>\n<td><code>members / keys / models / connections</code></td>\n</tr>\n</tbody></table></div>\n<p>Project 保留常用 Tab 与专业 Tab：overview/tasks/agents/memory/activity 服务日常协作，assets/runs/settings 承载资产、运行与项目设置；概览快捷入口和详情 Tab 指向同一对象集合，跨全局列表跳转时继续携带 Project 筛选。\nAgent 保留 overview/projects/assembly/memory/runs/policy/versions：概览给摘要，projects、policy、versions 提供专业关系与解释视图；原型的策略、版本展示不代表真实更新或 revision 存储已经实现。Governance 不再内嵌第二套 Run 控制台，只链接 <code>runs/run</code>。</p>\n<h3>3.2 桌面布局与视觉约束</h3>\n<ul>\n<li>保留现有 Tea Component、腾讯蓝主强调、中性灰底、细边框与高信息密度；生产实现从既有 Tea token 取色，原型蓝色可采用 V2 的 <code>#2563eb</code>，不另加营销渐变。[E15]</li>\n<li>全局层：顶部实例/团队与用户区、使用指南入口；左侧分组导航；内容层：面包屑 → 对象页头 → Tab → 筛选 → 内容；不存在同时竞争的第二套全局上下文选择器。</li>\n<li>参考尺寸：顶部 52–56px、侧栏 224px、内容边距 24px、表格行高 44px、正文 14px；桌面详情默认主内容与关系摘要 2:1，卡片圆角 6px。</li>\n<li>工作台首屏优先“待我审批 / 阻塞任务 / 最近运行”，数量卡可点击且带统计范围；项目与 Agent 不使用大面积装饰图替代关系表。</li>\n<li>表格左列为对象名/状态，右列固定操作；ID、traceId、bundleId、版本使用等宽；长内容摘要截断但提供键盘可达的完整内容入口。</li>\n<li>原型有“文档 / 原型”双模式：文档目录负责解释，原型侧栏负责操作；原型切换模式默认回到首页，不承诺模式间保留当前对象；可通过浏览器前进后退恢复历史视图。所有页面持续提示“演示数据，不连接后端”。</li>\n</ul>\n<h3>3.3 上下文、深链与响应式</h3>\n<ul>\n<li>生产目标 URL 示例：<code>/projects/:id/overview</code>、<code>/agents/:id/assembly</code>、<code>/tasks/:id/runs</code>、<code>/runs/:id/context</code>；原型用 hash 保存 route、实体与 Tab，具体编码以配套 HTML 实现为准。</li>\n<li>URL 是可分享上下文与筛选的权威；本地存储只记最近默认值。切 Team 后验证 Project，再验证 Agent/Task；无效下游清除并解释，不静默显示其他团队同名对象。</li>\n<li>多对象打开以 <code>route + entityId + tab</code> 区分；不得沿用仅按 PageId 标识实体详情的逻辑；返回列表恢复筛选、页码与滚动位置。[E16]</li>\n<li>1440/1024px 为常规桌面；768px 侧栏收起、详情单列；320px 筛选折叠、抽屉全屏、局部表格横向滚动，页面本身无意外水平溢出。</li>\n</ul>\n"},{"id":"architecture","label":"系统架构与职责边界","html":"<h2>4. 系统架构与职责边界</h2>\n<div class=\"table-wrap diagram\" aria-label=\"系统架构图\"><svg id=\"diagram-1\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1137.671875px;\" viewBox=\"0 0 1137.671875 734.1300048828125\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#diagram-1{font-family:Arial,Microsoft YaHei,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-1 .error-icon{fill:#552222;}#diagram-1 .error-text{fill:#552222;stroke:#552222;}#diagram-1 .edge-thickness-normal{stroke-width:1px;}#diagram-1 .edge-thickness-thick{stroke-width:3.5px;}#diagram-1 .edge-pattern-solid{stroke-dasharray:0;}#diagram-1 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-1 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-1 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-1 .marker{fill:#666;stroke:#666;}#diagram-1 .marker.cross{stroke:#666;}#diagram-1 svg{font-family:Arial,Microsoft YaHei,sans-serif;font-size:16px;}#diagram-1 p{margin:0;}#diagram-1 .label{font-family:Arial,Microsoft YaHei,sans-serif;color:#000000;}#diagram-1 .cluster-label text{fill:#333;}#diagram-1 .cluster-label span{color:#333;}#diagram-1 .cluster-label span p{background-color:transparent;}#diagram-1 .label text,#diagram-1 span{fill:#000000;color:#000000;}#diagram-1 .node rect,#diagram-1 .node circle,#diagram-1 .node ellipse,#diagram-1 .node polygon,#diagram-1 .node path{fill:#eee;stroke:#999;stroke-width:1px;}#diagram-1 .rough-node .label text,#diagram-1 .node .label text,#diagram-1 .image-shape .label,#diagram-1 .icon-shape .lab "basic label-container\" style=\"\" x=\"-98.4609375\" y=\"-27\" width=\"196.921875\" height=\"54\"></rect><g class=\"label\" style=\"\" transform=\"translate(-68.4609375, -12)\"><rect></rect><foreignObject width=\"136.921875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>现有 Analytics 代理</p></span></div></foreignObject></g></g><g class=\"node default\" id=\"diagram-1-flowchart-T-27\" data-look=\"classic\" transform=\"translate(1031.2109375, 409.5556755065918)\"><path d=\"M0,14.707168956821574 a89.3046875,14.707168956821574 0,0,0 178.609375,0 a89.3046875,14.707168956821574 0,0,0 -178.609375,0 l0,53.707168956821576 a89.3046875,14.707168956821574 0,0,0 178.609375,0 l0,-53.707168956821576\" class=\"basic label-container outer-path\" style=\"\" transform=\"translate(-89.3046875, -41.560753435232364)\"></path><g class=\"label\" style=\"\" transform=\"translate(-81.8046875, -2)\"><rect></rect><foreignObject width=\"163.609375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel\"><p>Telemetry / ClickHouse</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"diagram-1-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"diagram-1-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><linearGradient id=\"diagram-1-gradient\" gradientUnits=\"objectBoundingBox\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"hsl(0, 0%, 83.3333333333%)\" stop-opacity=\"1\"></stop><stop offset=\"100%\" stop-color=\"hsl(0, 0%, 88.9215686275%)\" stop-opacity=\"1\"></stop></linearGradient></svg></div><details><summary>查看图的 Mermaid 源定义</summary><pre>flowchart TD\n  UI[Web 控制台与交互层] --&gt; P[MemoryPanel API 与目标聚合读模型]\n  SDK[现有 SDK 或 Agent Adapter] --&gt; G[现有认证 Gateway 或 Proxy]\n  P --&gt; C[MemoryCore 权限与元数据服务]\n  P --&gt; K[MemoryKnowledge Wiki 与 Code]\n  G --&gt; C\n  C --&gt; M[记忆检索 写入 策略与生命周期]\n  C --&gt; B[目标 ExecutionBundle 编译与快照]\n  M --&gt; D[(元数据与记忆存储)]\n  K --&gt; I[(知识内容与检索索引)]\n  B -.授权执行契约待补齐.-&gt; R[已有 Agent Runtime 或外部执行器]\n  R -.事件接入目标.-&gt; E[Run Approval Audit 读模型]\n  P --&gt; E\n  P --&gt; A[现有 Analytics 代理]\n  A --&gt; T[(Telemetry / ClickHouse)]\n</pre></details>\n<p>Web 只通过 Panel 获取浏览器所需数据，不携带 Core 管理密钥；SDK/Adapter 沿用其已有认证接入，不能因 V2 的简图就要求所有客户端改走 BFF。此图是职责图，不新增部署服务。\nPanel 聚合 Project/Agent/Task/Governance 首屏，透传调用者身份与权限结果，不复制 Core 的权限裁决；Knowledge 专业请求仍保留独立 client 和工作台。\nCore 是 scope、命令授权、写策略与版本冲突的权威；当前 <code>resolveExecutionBundle</code> 是确定性纯函数，不读库、不掌握授权和终态，目标完整编译需额外的 caller-aware 编排与持久化。[E9]\nRun 回放消费事实事件，不由浏览器根据卡片颜色推状态；Analytics 读取线上遥测，与 Code 的语义检索、依赖图谱和影响分析独立。连接不可用时显式失败，不能偷偷换模型/数据源。</p>\n"},{"id":"sequences","label":"用户工作流与核心时序","html":"<h2>5. 用户工作流与核心时序</h2>\n<h3>5.1 首次使用与闭环导航</h3>\n<ol>\n<li>登录并确认实例/Team；若尚无可访问项目，展示创建权限说明或申请加入，不展示虚构的“0 个任务完成率”。</li>\n<li>进入 Project，阅读目标与成员；从已有资产选择 Wiki/Code/Skill，再选择 Agent。第一期缺少多项目关系时仅允许当前单项目选择。</li>\n<li>新建 Task，填写目标、验收标准、风险与声明 Agent；检查执行包预览。无执行契约时按钮标“演示启动 / 待接执行”，不能伪装发起生产 Run。</li>\n<li>查看 Run 时间线、上下文、工具与产物；遇到审批转入 Governance，决策后回到原 Run；失败保留同一证据链并允许创建新尝试。</li>\n<li>项目负责人评审交付，接受后 Task 进入 done；“沉淀为记忆”仍需选择 Space、来源与写策略，不能因任务完成就自动公开。</li>\n</ol>\n<h3>5.2 Project 首屏：少请求但不绕权限（目标）</h3>\n<div class=\"table-wrap diagram\" aria-label=\"核心调用时序图\"><svg id=\"diagram-2\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width: 1346px;\" viewBox=\"-50 -10 1346 810\" role=\"graphics-document document\" aria-roledescription=\"sequence\"><g><rect x=\"1096\" y=\"724\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" hei -baseline=\"central\" class=\"actor actor-man\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif;\"><tspan x=\"1067\" dy=\"0\">有权 Reviewer</tspan></text></g><text x=\"273\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">candidate + sourceRef + explicitIntent</text><line x1=\"106\" y1=\"109\" x2=\"439\" y2=\"109\" class=\"messageLine0\" data-et=\"message\" data-id=\"i0\" data-from=\"A\" data-to=\"P\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></line><text x=\"444\" y=\"124\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">校验 actor scope 写权限与策略</text><path d=\"M 444,153 C 504,143 504,183 444,173\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"P\" data-to=\"P\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></path><text x=\"276\" y=\"243\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">拒绝并记录 reasonCode</text><line x1=\"442\" y1=\"272\" x2=\"109\" y2=\"272\" class=\"messageLine1\" data-et=\"message\" data-id=\"i3\" data-from=\"P\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"></line><text x=\"574\" y=\"332\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">持久化 pending 与影响预览</text><line x1=\"444\" y1=\"361\" x2=\"703\" y2=\"361\" class=\"messageLine0\" data-et=\"message\" data-id=\"i5\" data-from=\"P\" data-to=\"Q\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></line><text x=\"886\" y=\"376\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">待审摘要及截止时间</text><line x1=\"708\" y1=\"405\" x2=\"1063\" y2=\"405\" class=\"messageLine1\" data-et=\"message\" data-id=\"i6\" data-from=\"Q\" data-to=\"H\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"></line><text x=\"889\" y=\"420\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">claim + decide(expectedVersion, reason)</text><line x1=\"1066\" y1=\"449\" x2=\"711\" y2=\"449\" class=\"messageLine0\" data-et=\"message\" data-id=\"i7\" data-from=\"H\" data-to=\"Q\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></line><text x=\"708\" y=\"509\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">先持久化批准事件</text><path d=\"M 708,538 C 768,528 768,568 708,558\" class=\"messageLine0\" data-et=\"message\" data-id=\"i9\" data-from=\"Q\" data-to=\"Q\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></path><text x=\"986\" y=\"583\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">幂等写入并记录来源</text><line x1=\"708\" y1=\"612\" x2=\"1263\" y2=\"612\" class=\"messageLine0\" data-et=\"message\" data-id=\"i10\" data-from=\"Q\" data-to=\"M\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></line><text x=\"989\" y=\"627\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">executed 或 execution_failed</text><line x1=\"1266\" y1=\"658\" x2=\"711\" y2=\"658\" class=\"messageLine1\" data-et=\"message\" data-id=\"i11\" data-from=\"M\" data-to=\"Q\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"></line><text x=\"408\" y=\"718\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">无写入副作用，保留决策证据</text><line x1=\"706\" y1=\"747\" x2=\"109\" y2=\"747\" class=\"messageLine1\" data-et=\"message\" data-id=\"i13\" data-from=\"Q\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"></line><text x=\"854\" y=\"817\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif; font-size: 16px; font-weight: 400;\">脱敏 去重 版本化写入</text><line x1=\"444\" y1=\"846\" x2=\"1263\" y2=\"846\" class=\"messageLine0\" data-et=\"message\" data-id=\"i16\" data-from=\"P\" data-to=\"M\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#diagram-4-arrowhead)\" style=\"fill: none;\"></line><g class=\"actor-man actor-bottom\" name=\"H\" style=\"stroke: rgb(212, 212, 212);\"><line id=\"actor-man-torso14\" x1=\"1067\" y1=\"901\" x2=\"1067\" y2=\"921\"></line><line id=\"actor-man-arms14\" x1=\"1049\" y1=\"909\" x2=\"1085\" y2=\"909\"></line><line x1=\"1049\" y1=\"936\" x2=\"1067\" y2=\"921\"></line><line x1=\"1067\" y1=\"921\" x2=\"1083\" y2=\"936\"></line><circle cx=\"1067\" cy=\"886\" r=\"15\" width=\"150\" height=\"65\"></circle><text x=\"1067\" y=\"943.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-man\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: Arial, &quot;Microsoft YaHei&quot;, sans-serif;\"><tspan x=\"1067\" dy=\"0\">有权 Reviewer</tspan></text></g></svg></div><details><summary>查看图的 Mermaid 源定义</summary><pre>sequenceDiagram\n  participant A as Agent 提炼或用户显式命令\n  participant P as Scope 与 Policy Gate\n  participant Q as Approval Store\n  actor H as 有权 Reviewer\n  participant M as Memory Store\n  A-&gt;&gt;P: candidate + sourceRef + explicitIntent\n  P-&gt;&gt;P: 校验 actor scope 写权限与策略\n  alt deny 或 explicit_only 缺少显式意图\n    P--&gt;&gt;A: 拒绝并记录 reasonCode\n  else review_required 或额外风险审批\n    P-&gt;&gt;Q: 持久化 pending 与影响预览\n    Q--&gt;&gt;H: 待审摘要及截止时间\n    H-&gt;&gt;Q: claim + decide(expectedVersion, reason)\n    alt approved 且执行时权限仍有效\n      Q-&gt;&gt;Q: 先持久化批准事件\n      Q-&gt;&gt;M: 幂等写入并记录来源\n      M--&gt;&gt;Q: executed 或 execution_failed\n    else rejected / expired / 权限变化\n      Q--&gt;&gt;A: 无写入副作用，保留决策证据\n    end\n  else automatic 或合法 explicit_only\n    P-&gt;&gt;M: 脱敏 去重 版本化写入\n  end\n</pre></details>\n<p>审批超时采用 V2 的 120 秒候选默认值，正式实现需返回服务端 <code>expiresAt</code> 并评审适用范围；UI 倒计时不是裁决权威。产出请求的模型不得自批，批准记录与副作用结果分别展示。</p>\n<h3>5.5 记忆诊断与质量回路</h3>\n<ul>\n<li>诊断召回：选择 Agent/Project/Task → 输入问题与预算 → 服务端按同一 scope 检索 → 显示命中、过滤、排序与最终注入摘要 → 关联 Memory 来源；不得展示无权候选正文来“解释过滤”。</li>\n<li>纠错：来源抽屉 → 纠正内容与原因 → 比较版本和影响 → 按策略写入/待审 → 旧版本标替代；并发冲突保留草稿供人工合并。</li>\n<li>Skill 演进与 Dreaming 为后期目标：运行反馈生成候选版本或合并计划，需有来源、权限、幂等与复核；纯函数试调留在诊断区域，不提供“一键优化全部”承诺。</li>\n<li>Eval 固定同一数据集/配置版本比较 recall@k、MRR、nDCG 与 scope leakage；Analytics 只帮助发现异常时段，再下钻关联 Run/trace，两者不是同一种质量证据。</li>\n</ul>\n"},{"id":"modules","label":"使用指南：逐模块能做什么、如何操作、为什么","html":"<h2>6. 使用指南：逐模块能做什么、如何操作、为什么</h2>\n<p>本节是目标用户操作手册；各模块“边界”明确指出当前证据与待补能力。演示原型只模拟交互结果，不发真实命令。</p>\n<h3>6.1 工作台 <code>home</code></h3><a class=\"btn small\" href=\"#/app/home\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：找到待我审批、阻塞任务、失败运行、最近项目；指标限定当前可见范围，提醒按风险和等待时间排序。</li>\n<li><strong>如何操作</strong>：确认 Team/Project 范围 → 选一条待办 → 打开对象抽屉 → “进入工作区”；“新建任务”先选 Project，保留来源上下文。</li>\n<li><strong>为什么</strong>：默认页应帮助用户继续工作，而不是再复制一张资产统计大屏。</li>\n<li><strong>边界</strong>：现有路由默认是 Workbench；跨对象待办聚合为待契约。无待办与待办服务失败必须是两种状态。[E1]</li>\n</ul>\n<h3>6.2 项目列表与工作区 <code>projects / project</code></h3><a class=\"btn small\" href=\"#/app/projects\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：按名称、角色、visibility 筛项目；overview 看目标与摘要，tasks 看执行，agents 看参与者，assets 看关联资产，memory 看范围，activity 看决策与变更，runs 看运行，settings 看项目设置预览。</li>\n<li><strong>如何操作</strong>：创建项目填写名称/主团队/可见范围/描述，可选仓库锚点 → 进入概览 → 添加成员或关联资产 → 从任务 Tab 新建 Task；成员管理抽屉只对有权用户开放。</li>\n<li><strong>为什么</strong>：把持续工作上下文放在 Project，而不是要求用户先理解 Team 的八个管理 Tab；overview 中的资产/运行快捷入口带相同筛选跳转。</li>\n<li><strong>边界</strong>：Project CRUD/成员接口存在，记忆 Tab 是骨架；目标 overview、活动聚合与项目空间详情必须先补契约，不把接口失败当“没有记忆”。[E2、E3]</li>\n</ul>\n<h3>6.3 任务列表与详情 <code>tasks / task</code></h3><a class=\"btn small\" href=\"#/app/tasks\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：筛 Project、状态、风险、负责人；overview 显示目标/声明与实际参与，plan 显示步骤与阻塞，runs 显示尝试，artifacts 显示交付评审。</li>\n<li><strong>如何操作</strong>：填写标题、描述、验收标准、Agent 与风险 → 保存草稿/准备启动 → 查看计划 → 启动并跟踪 Run → 接受或退回交付；变更状态时说明理由。</li>\n<li><strong>为什么</strong>：Task 代表承诺结果，Run 代表一次尝试，失败重试不应重复造任务，也不应把“运行成功”直接当“业务验收通过”。</li>\n<li><strong>边界</strong>：现有前端 Task 状态只有 running/completed，create 缺 project 字段；计划、验收与完整状态机是目标。声明 Agent 和 ParticipationLog 已有分离证据，保留此语义。[E6]</li>\n</ul>\n<h3>6.4 Agent 列表与工作区 <code>agents / agent</code></h3><a class=\"btn small\" href=\"#/app/agents\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：筛 owner/Project/状态；overview 看职责和归属，projects 看项目关系，assembly 看三层装配，memory 看空间，runs 看历史，policy 看策略预览，versions 看版本示例；当前配置与历史快照明确分区，未实现部分仍标目标态。</li>\n<li><strong>如何操作</strong>：新建名称、职责、可见性 → 在 assembly 从有 use 权限的候选资产选择固定装配 → 确认作用范围 → 用“预览下一次运行”检查策略；历史 effective 必须先选择 Run。</li>\n<li><strong>为什么</strong>：用户既要知道“默认带什么”，也要知道“为什么这次没带”；预览不能覆盖运行事实，修改装配只影响未来解析。</li>\n<li><strong>边界</strong>：get、固定资产 get/set 存在；详情本身仍为占位；默认模板 get/set 已有 client，恢复入口仅限 system_admin。当前单项目字段不等于多项目功能已完成。[E4、E5]</li>\n</ul>\n<h3>6.5 Agent 编排 <code>orchestration</code></h3><a class=\"btn small\" href=\"#/app/orchestration\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：维护协作组、角色与成员，查看自动化触发配置和关联运行；Team 组织、AgentTeam 协作组使用不同名称与图标。</li>\n<li><strong>如何操作</strong>：新建协作组 → 选择已有 Agent 并指定职责 → 添加触发配置 → 检查目标和权限 → 保存演示配置；“预览执行”展示依赖而不启动真实任务。</li>\n<li><strong>为什么</strong>：将执行协作从组织成员管理剥离，避免管理员误以为加团队成员就是装配多 Agent 流程。</li>\n<li><strong>边界</strong>：AgentTeam/Automation 组件已有 list/create/member 操作；可视 DAG、冲突校验、调度重试与暂停语义为建议扩展，不声称当前已存在。[E7]</li>\n</ul>\n<h3>6.6 记忆中心 <code>memory</code></h3><a class=\"btn small\" href=\"#/app/memory\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：统一浏览、搜索、纠错与来源追溯；保留 Chat Memory L0–L3 工作视角；筛范围、domain、层级、来源和状态，支持检索试调入口。</li>\n<li><strong>如何操作</strong>：先选范围再搜索 → 打开记忆抽屉查看来源/版本 → 选择“纠正”或“归档预览” → 填原因并确认；导入时选来源与目标 Agent/Space，不默认公开。</li>\n<li><strong>为什么</strong>：用户先关心“记住了什么、为什么记住”，再看算法；搜索试调必须显示当前上下文与预算，避免不同 scope 的结果被误比较。</li>\n<li><strong>边界</strong>：ChatMemory 的分层查询、搜索、导入和分配已有调用；统一 MemoryCenter、召回解释、版本化显式命令待契约。L0/L1 时间过滤不能套到 L2/L3 聚合产物上；L1 刷新按历史恢复项单独验收。[E8、E14]</li>\n</ul>\n<h3>6.7 记忆空间 <code>spaces / space</code></h3><a class=\"btn small\" href=\"#/app/spaces\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：按 ownerType/domain/策略筛选；overview 解释边界，memories 看内容，mounts 看使用关系，policy 看写策略与影响。</li>\n<li><strong>如何操作</strong>：打开空间 → 确认拥有者与域 → 挂载到有权 Agent → 选择读写模式 → 预览未来影响；策略变更先显示受影响 Agent/记忆数量，再提交。</li>\n<li><strong>为什么</strong>：空间是共享与治理边界，不是另一个装满文件的文件夹；撤销挂载与删除内容必须是两个动作。</li>\n<li><strong>边界</strong>：当前 spaceList 返回 AgentSpace 挂载行，不是完整空间目录；去重不能用来冒充独立空间数量。get/mount/unmount/policy 更新待契约；策略放宽为建议且默认关闭。[E4、E9、E10]</li>\n</ul>\n<h3>6.8 资产目录与详情 <code>assets / asset</code></h3><a class=\"btn small\" href=\"#/app/assets\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：统一查看 Skill、Wiki、CodeGraph、ChatMemory 的元数据、可见范围、版本和引用；按类型、owner、Project、状态筛选。</li>\n<li><strong>如何操作</strong>：搜索资产 → 查看详情及“可访问原因” → 选择专业工作台或分配给 Agent；绑定前检查 use 权限，完成后只标“固定装配”，不标“本轮已使用”。</li>\n<li><strong>为什么</strong>：统一的是发现、权限和关系，不能用一张通用文本编辑表单替代四种资产工作流。</li>\n<li><strong>边界</strong>：底层类型继续使用 <code>llm_wiki</code>，展示名可叫 Wiki；Skill fork 与知识 allocate 保留专属语义；现有物理删除 client 不在原型调用。[E5、E13]</li>\n</ul>\n<h3>6.9 Wiki <code>wiki</code></h3><a class=\"btn small\" href=\"#/app/wiki\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：管理知识来源、内容预览、搜索问答与知识关系，显示处理状态和引用来源；专业内容页保留左右分栏。</li>\n<li><strong>如何操作</strong>：选择来源/导入 → 等待解析完成 → 查内容或提问 → 从引用回到原文 → 需要复用时回资产关系区装配。</li>\n<li><strong>为什么</strong>：知识可信度取决于出处和处理状态，不是仅显示“导入成功”；同步失败不能丢掉最后可用版本。</li>\n<li><strong>边界</strong>：沿用 WikiSourcesPanel/useWikiSources 的来源和内容能力；统一版本锁定、Run 级引用关系仍待契约。[E17]</li>\n</ul>\n<h3>6.10 Code 与代码分析 <code>code / analysis</code></h3><a class=\"btn small\" href=\"#/app/analysis\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：Code 管仓库/分支/同步来源；analysis 做代码搜索、探索、分析与图谱，选择同一 codeGraphId 下钻，明确仓库 revision。</li>\n<li><strong>如何操作</strong>：在 Code 登记仓库并同步 → 检查索引状态 → “进入代码分析” → 在分析/图谱间切换 → 打开文件/符号引用；失败重试保留已可用索引。</li>\n<li><strong>为什么</strong>：来源生命周期与分析任务不同，保留两个入口但共享资产引用；不再引入第二个一级 CodeGraph 目录。</li>\n<li><strong>边界</strong>：当前 <code>CodeAnalysisRepoPage</code> 已通过 <code>CodeGraphPage fixedCgId embedded</code> 接入图谱，不能沿用历史“整页孤儿无入口”结论；剩余子组件是否全接通需逐项实现验收。[E11、E17]</li>\n</ul>\n<h3>6.11 Skill <code>skills / skill</code></h3><a class=\"btn small\" href=\"#/app/skills\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：查看技能说明/正文/来源、导入导出、fork 给 Agent；目标补充版本、演进候选与运行引用，区分目录索引披露和正文加载。</li>\n<li><strong>如何操作</strong>：查看适用任务和依赖 → 读正文 → fork 或选择固定版本 → 检查 Agent 装配；候选更新先看差异与评测，再由有权人发布。</li>\n<li><strong>为什么</strong>：技能是可复用操作知识，不等于新增工具 callable；自动演进不能悄悄覆盖正在使用的稳定版本。</li>\n<li><strong>边界</strong>：已有 Skill 专业面板与导入/fork/export 组件；完整演进闭环、版本快照和发布审批属于目标，不从 transition 纯函数推导已具备发布服务。[E8、E17]</li>\n</ul>\n<h3>6.12 运行列表与回放 <code>runs / run</code></h3><a class=\"btn small\" href=\"#/app/runs\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：按 Agent/Task/Project/状态/时间找运行；timeline 看事件，context 看有效快照，tools 看调用摘要/审批，artifacts 看产物。</li>\n<li><strong>如何操作</strong>：从 Task 或 Analytics 打开 Run → 选失败事件 → 查看工具参数脱敏摘要及前置审批 → 查看当时上下文；重试创建新 attempt，不覆盖历史 Run。</li>\n<li><strong>为什么</strong>：异常定位需要因果链，不是整段 JSON；“回放”是读事件，不会再次执行工具。</li>\n<li><strong>边界</strong>：现有 RunTrace get/list 与 trace_json 可复用；list 尚无 task/project 筛选，结构化 timeline、流恢复、快照和安全重试需新增契约。[E12]</li>\n</ul>\n<h3>6.13 治理 <code>governance</code></h3><a class=\"btn small\" href=\"#/app/governance\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：approvals 处理待审写入；permissions 查角色和授权；audit 查操作者/目标/结果；evals 比较检索质量与回归样例。</li>\n<li><strong>如何操作</strong>：筛待审/风险 → 打开影响详情 → 填理由批准或拒绝 → 检查执行结果；权限修改先看目标和作用域，审计只读；评测需选固定数据集与候选版本。</li>\n<li><strong>为什么</strong>：审批、权限、审计、评测解决四个不同问题，共享对象链接但不揉成一张含糊的“治理日志”。</li>\n<li><strong>边界</strong>：写审批 list/approve/reject 已有；原子 claim、超时恢复、跨域 Inbox 与持久化 EvalSuite/EvalRun 待契约；即时传入数组算指标不等于拥有历史趋势。[E7、E8]</li>\n</ul>\n<h3>6.14 线上调用情况 <code>analytics</code></h3><a class=\"btn small\" href=\"#/app/analytics\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：查看会话调用概况、工具调用明细、成员/模型用量、延迟与成本，按时间和授权实例过滤；指标展示统计口径和采样/延迟说明。</li>\n<li><strong>如何操作</strong>：确认当前实例 → 选时间范围 → 切调用概况/模型用量 → 点击成员、模型或异常明细 → 打开脱敏 trace；只有存在真实关联时才跳 Run。</li>\n<li><strong>为什么</strong>：线上用量分析服务运营与排障，<code>analysis</code> 则研究代码；名称、导航、数据源与空态必须分开。</li>\n<li><strong>边界</strong>：Analytics client、能力探测、Panel/Core 代理仍在，当前 Web 路由未注册此页。现有业务查询要求 system_admin，不能把普通项目 manager 宣称为有权用户；分母为 0 的比率显示“—”，不是 0%。[E1、E18]</li>\n</ul>\n<h3>6.15 团队 <code>team</code> 与设置 <code>settings</code></h3><a class=\"btn small\" href=\"#/app/settings\">打开对应交互原型 →</a>\n<ul>\n<li><strong>能做什么</strong>：Team 管组织归属、工作规范与公共池摘要；Settings 将 members、keys、models、connections 分开，提供默认 Agent 模板的管理入口。</li>\n<li><strong>如何操作</strong>：成员页筛身份/角色并查看授权范围；Key 页看指纹/用途/有效期，真实新建仅一次展示；模型页选 provider/model 并测试连接；连接页分别管理知识、工具与遥测接入。</li>\n<li><strong>为什么</strong>：Team 是组织事实，Settings 是配置动作；“模型连接成功”不等于已授权全部 Agent 使用，也不等于 Analytics 数据源可用。</li>\n<li><strong>边界</strong>：成员、API Key、模型及工具源已有页面/client；统一设置壳、连接健康聚合与细粒度权限体验为目标。原型只用明显虚构标记，不采集真实密钥、不执行撤销。[E1、E7、E19]</li>\n</ul>\n"},{"id":"chapter-8","label":"通用交互规格","html":"<h2>7. 通用交互规格</h2>\n<ul>\n<li><strong>筛选</strong>：列表默认当前 Team、全部可见 Project；关键词与类型/状态筛选按 AND 组合，切范围清页码；提交后在 URL 保存条件，显示命中数或“总量未知”；“清除”只清当前列表筛选。</li>\n<li><strong>表格</strong>：默认最近更新倒序，服务端稳定次序增加 ID 次键；分页不假装加载全部。跨页选择须显式“选择全部符合条件”，默认仅当前页，筛选改变时清空选择。</li>\n<li><strong>跨对象抽屉</strong>：头部显示类型、名称、ID、权限与“进入详情”；正文分摘要、关系、来源。继续点关联对象在同一抽屉切内容并保留返回栈，不叠无限模态窗。</li>\n<li><strong>抽屉关闭</strong>：Esc/关闭按钮可用；有未保存内容先询问放弃；关闭后焦点回原触发器，触发器消失则回列表标题。敏感内容按详情权限获取，不预装进隐藏 DOM。</li>\n<li><strong>新建与编辑表单</strong>：名称/标题必填且 trim，长度限制以服务端 schema 为准；明确必填字段、可见范围、作用对象；提交前校验，提交中防双击，失败保留草稿和 requestId。</li>\n<li><strong>变更反馈</strong>：读写成功应更新受影响列表与对象摘要；目标异步操作返回操作 ID，显示排队/执行/完成，不用统一“保存成功”掩盖后台失败。</li>\n<li><strong>风险动作</strong>：解绑、归档、权限变更先 preview 影响和未来生效范围；批准/拒绝需理由和对象版本；原型只做演示状态变更，不调用真实删除或写接口。</li>\n<li><strong>演示数据一致性</strong>：一条 Task/Run/Approval 使用稳定 ID 相互引用；同一审批从抽屉批准后列表不再显示 pending；演示重置只重置本页演示状态，不清浏览器其他数据。</li>\n<li><strong>无障碍</strong>：导航有区域名称，Tab 有选中状态与键盘操作，表头关联单元格；焦点可见、抽屉焦点约束、消息使用 aria-live；状态含文字/图标，不只依赖颜色，普通文字对比度目标 4.5:1。</li>\n<li><strong>可用性</strong>：缩小动效遵循 prefers-reduced-motion；日期显示时区、相对时间可查绝对值；生产中英文键成对，ID 不翻译，Markdown/文件预览不得执行嵌入脚本。</li>\n</ul>\n"},{"id":"permissions","label":"权限与安全边界","html":"<h2>8. 权限与安全边界</h2>\n<p>角色名称是展示语言，不替代服务端权限；当前 <code>system_admin</code> 是全局身份，TeamRole 为 admin/member/reviewer，ProjectMember 为 manager/member；目标 viewer 是只读体验映射，不能直接写入旧枚举。[E3、E19]</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>动作</th>\n<th>平台管理员</th>\n<th>项目 owner / manager</th>\n<th>成员 / 资产 owner</th>\n<th>Reviewer / viewer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>看项目、资产、记忆详情</td>\n<td>管理权不自动代表私有正文可读</td>\n<td>项目可见且对象授权</td>\n<td>自有或明确授权</td>\n<td>授权范围内只读</td>\n</tr>\n<tr>\n<td>改项目成员与项目属性</td>\n<td>按实际管理权限</td>\n<td>manager 可管理，owner 转移另验权</td>\n<td>无默认管理权</td>\n<td>不允许</td>\n</tr>\n<tr>\n<td>创建 Task / 使用 Agent</td>\n<td>另验对象 use 权限</td>\n<td>项目内有写/use 权限</td>\n<td>项目内有写/use 权限</td>\n<td>viewer 不允许；Reviewer 另验权</td>\n</tr>\n<tr>\n<td>固定装配 / 空间挂载</td>\n<td>另验管理与资源权限</td>\n<td>不因项目身份自动拥有所有 Agent</td>\n<td>Agent 管理权与资产/空间 use 权限均满足</td>\n<td>无默认权限</td>\n</tr>\n<tr>\n<td>记忆纠错 / 归档</td>\n<td>写权限与策略仍生效</td>\n<td>写权限与策略均满足</td>\n<td>owner 仍受 scope/策略约束</td>\n<td>仅特定授权可提交</td>\n</tr>\n<tr>\n<td>批准风险写入</td>\n<td>需审批权限与利益冲突校验</td>\n<td>不能因 manager 自动自批</td>\n<td>请求方不能自行取得审批权</td>\n<td>Reviewer 在授权范围决策；viewer 不允许</td>\n</tr>\n<tr>\n<td>用户授权 / 全局配置</td>\n<td>对应管理权限</td>\n<td>默认不允许</td>\n<td>仅显式授予的管理权限</td>\n<td>默认不允许</td>\n</tr>\n<tr>\n<td>Analytics 查询 / 默认模板设置</td>\n<td>当前 system_admin 路径</td>\n<td>当前不支持</td>\n<td>当前不支持</td>\n<td>当前不支持</td>\n</tr>\n</tbody></table></div>\n<p>此表是目标最小权限设计；实现时逐动作对照现有 Core，差异建立契约任务，不靠隐藏按钮“修复”授权。未知 role 映射只读，未知 capability/operation 拒绝。\n计数、搜索建议、关系数量和错误文案同样要授权；不可见对象与不存在对象使用一致外显信息。已知且公开的功能可显示“无权限”，私有对象不暴露 owner/名称以解释拒绝。\n写操作从认证上下文取得 actor，浏览器不能通过 body 指定审批人；执行副作用前重新校验权限。密钥不写 URL、日志、审计正文或原型样例；审计只记录指纹/引用。</p>\n"},{"id":"chapter-10","label":"状态与异常恢复","html":"<h2>9. 状态与异常恢复</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>UI 状态</th>\n<th>展示与可用动作</th>\n<th>不允许的行为</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>loading</td>\n<td>与最终布局同结构的骨架、区域忙碌标记</td>\n<td>先闪现旧团队数据或真实 0</td>\n</tr>\n<tr>\n<td>empty</td>\n<td>说明当前范围确实无记录，有权限时给创建入口</td>\n<td>把超时/无权/未实现当空数据</td>\n</tr>\n<tr>\n<td>filtered-empty</td>\n<td>展示生效筛选，给清除筛选</td>\n<td>引导重复创建已有对象</td>\n</tr>\n<tr>\n<td>partial</td>\n<td>标出失败区和截至时间，局部重试</td>\n<td>一处故障让全页不可用，或失败指标写 0</td>\n</tr>\n<tr>\n<td>error</td>\n<td>错误摘要、requestId、重试，保留筛选和草稿</td>\n<td>无限自动重试、泄露内部堆栈</td>\n</tr>\n<tr>\n<td>denied / unavailable</td>\n<td>功能权限说明或统一对象不可访问页</td>\n<td>隐藏路由后仍返回敏感数据</td>\n</tr>\n<tr>\n<td>disabled / unconfigured</td>\n<td>功能未启用 / 连接未配置，管理员可进入设置</td>\n<td>都折叠成“暂无数据”</td>\n</tr>\n<tr>\n<td>offline / stale</td>\n<td>断线横幅、最后更新时间、只读旧数据</td>\n<td>离线继续批准、拿缓存权限做决定</td>\n</tr>\n<tr>\n<td>conflict</td>\n<td>列出现版本与草稿差异，重新读取后确认</td>\n<td>409 时自动覆盖他人修改</td>\n</tr>\n<tr>\n<td>success / processing</td>\n<td>区分已保存、排队、执行完毕；给下一步对象链接</td>\n<td>收到请求就宣布副作用完成</td>\n</tr>\n</tbody></table></div>\n<p>目标 Task：<code>backlog → ready → running → review → done</code>；运行中可 blocked，解除后回 running，review 可退回 running，非终态可 cancelled。每次转换需权限、版本和理由，blocked 必有阻塞原因；done 不由活跃时间推断。\n目标 Run：<code>accepted → compiling → prepared → queued → running → succeeded/failed/cancelled/timed_out</code>；运行可暂停为 approval_pending，批准恢复，拒绝/过期进入 rejected；编译与排队失败也必须有明确终态。\n目标 Memory：active 可转 superseded、archived、quarantined；恢复须检查来源和权限，历史版本不可通过恢复静默覆盖新版本。Approval 分 pending/approved/rejected/expired/cancelled，并独立显示 executionStatus。\n上述枚举不是当前前端状态表；兼容层必须保留旧值及其来源，未知状态显示“未知（原值）”并只读，不能默认当 succeeded。</p>\n"},{"id":"chapter-11","label":"页面与服务契约（目标草案，非已上线接口清单）","html":"<h2>10. 页面与服务契约（目标草案，非已上线接口清单）</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>契约</th>\n<th>最小输入 / 输出</th>\n<th>页面消费与边界</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>POST /api/v1/project-workspace/overview</code></td>\n<td>projectId → project/viewer/counts/recent/warnings/asOf</td>\n<td>Project 首屏；可见计数、固定数量聚合、只取 top N</td>\n</tr>\n<tr>\n<td><code>POST /api/v1/agent-workspace/overview</code></td>\n<td>agentId + context → agent/accessible/fixed/spaces/latestEffective</td>\n<td>三层分开；accessible 的 viewer 与 Agent 主体分别授权</td>\n</tr>\n<tr>\n<td><code>POST /api/v1/task-workspace/detail</code></td>\n<td>taskId → task/declaredAgents/participants/plan/runs/artifacts/approvals</td>\n<td>嵌套列表首屏上限明确，后续独立分页</td>\n</tr>\n<tr>\n<td><code>POST /api/v1/governance/inbox</code></td>\n<td>scope/type/status/cursor → subjectRef/reasonCode/risk/actionSchema</td>\n<td>只返回可处理摘要，敏感参数延迟获取</td>\n</tr>\n<tr>\n<td><code>POST /api/v1/memory-center/list/search/explain</code></td>\n<td>scope/domain/status/query/topK/tokenBudget → hits/provenance/explanation</td>\n<td>三个独立操作；search 不改变记忆，explain 不泄露越权候选</td>\n</tr>\n<tr>\n<td><code>GET /api/v1/memory-spaces/:id</code> 与 <code>/mounts</code></td>\n<td>id + cursor → space/policy/stats 或可见挂载分页</td>\n<td>独立空间与挂载去重口径清楚，不直接透出 AgentSpace 数组冒充</td>\n</tr>\n<tr>\n<td>Space <code>mount/unmount/policy/preview/policy/update</code></td>\n<td>subjectRef/expectedVersion/reason → impact/operation/result</td>\n<td>沿用 V2 command 路径草案；放宽默认拒绝，preview 有有效期</td>\n</tr>\n<tr>\n<td>Memory <code>remember/correct/forget/restore</code></td>\n<td>spaceId/sourceRef/content 或 memoryId/version/reason</td>\n<td>语义命令待定正式路径；写入与候选审批结果分开</td>\n</tr>\n<tr>\n<td>Run detail/events（路径待定）</td>\n<td>runId/cursor → snapshot/events/nextCursor/gaps</td>\n<td>按 sequence 去重续读，旧 trace 降级只读，不补造事件</td>\n</tr>\n<tr>\n<td>Approval claim/decide（扩展待定）</td>\n<td>approvalId/expectedVersion/decision/reason/idempotencyKey</td>\n<td>由服务端 actor 决策，原子争抢，副作用严格后置</td>\n</tr>\n</tbody></table></div>\n<p>统一目标响应 <code>{requestId, data, warnings?, asOf?}</code>；现有客户端使用 <code>MetaEnvelope.code/message/data/request_id</code>，必须显式 adapter 映射，不能在原路由无版本切换地更改所有响应。[E8]\n列表采用稳定排序与有界分页，建议默认 20、最大 100，正式上限以 schema 评审为准；返回 total 时必须是可见过滤集合的总数，无法精确计算则 total=null，不做假全量。\n变更命令携带 idempotencyKey、expectedVersion 与治理 reason；actor/instance 来自认证。目标错误映射 400/422 校验、401 会话失效、403/404 权限策略、409 冲突、429 限流、503 能力不可用，业务错误码保持可追溯。\nExecutionBundle V2 至少固化 context、Agent revision、资产版本与 injectionMode、空间来源/读写策略、工具描述版本、policyDecisions、sourceChain；当前 <code>direct/summary/tool/reference</code> 与目标 <code>index/full/tool</code> 不能按字符串盲映射。[E5、E9]\nbundleId 应由规范化配置内容稳定 hash 得到，不把 resolvedAt 这种观测时间纳入配置 hash；Run 另存时间、快照 revision。没有真实命中事件时仅证明配置，不证明某条记忆实际被模型使用。\n所有统计/表单依赖能力声明；契约未实现时产品显示“待接入”而不是乐观成功。生产完成门槛是 route → client → Panel → 权限化服务 → 存储/执行 → 错误恢复的完整链路。</p>\n"},{"id":"chapter-12","label":"分期、迁移与风险控制","html":"<h2>11. 分期、迁移与风险控制</h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>可独立交付的范围</th>\n<th>依赖与放行条件</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>D0 本轮设计</td>\n<td>本文与新 HTML，保留旧原型</td>\n<td>只验证文档和原型；不宣称业务功能上线</td>\n</tr>\n<tr>\n<td>R0 能力恢复</td>\n<td>Analytics、默认模板、L1 refresh、管理入口/守卫</td>\n<td>原调用链逐项核验，恢复真实请求与异常态，不整目录覆盖</td>\n</tr>\n<tr>\n<td>C1 契约切片</td>\n<td>Project/Agent/Task 读模型，筛选透传与缓存隔离</td>\n<td>contract test、权限负例、partial、首屏请求预算</td>\n</tr>\n<tr>\n<td>C2 关系与事实</td>\n<td>AgentProject、SpaceMount、Bundle 快照、来源链</td>\n<td>增量迁移、shadow read、幂等、历史数据降级</td>\n</tr>\n<tr>\n<td>U1 工作区</td>\n<td>新导航与 Project/Agent/Task/Memory/Asset</td>\n<td>依赖对应契约逐页放行；专业工作台能力等价</td>\n</tr>\n<tr>\n<td>G1 治理闭环</td>\n<td>审批事件/Run 回放/持久化 Eval</td>\n<td>先完成版本与审计；质量算法优化另建 change</td>\n</tr>\n</tbody></table></div>\n<ul>\n<li><strong>旧路由</strong>：保留 <code>/team/members</code>、<code>/team/agents</code>、<code>/team/agents/:id</code>、<code>/team/api-keys</code>、<code>/memory-spaces</code>、<code>/graph</code> 和现有专业入口；未来等价能力验收后再 redirect，不能把旧成员入口一律丢回无上下文首页。</li>\n<li><strong>数据</strong>：先加关系/版本存储，不删除旧列；单值 Agent.project_id 回填为一条边，缺 Project 的 Task 保持“未归项目”；Space 用 owner/domain 身份去重，但保留原挂载行供对账。</li>\n<li><strong>状态兼容</strong>：legacy completed 映射为“历史完成（无验收记录）”，不能伪造 accepted 事件；legacy running 保留旧语义，不凭时间猜 backlog/review。</li>\n<li><strong>灰度与回滚</strong>：按 Team/Project 开关切新读模型，双写需事务或补偿记录，shadow read 比较计数/权限/关系；回滚关闭开关、保留新写数据和事件，不做破坏性回退。</li>\n<li><strong>风险</strong>：任务缓存当前仅以 offset/limit 标识页且未透传筛选，迁移前须修 caller/team/project/filter 缓存键；Analytics 能力探测失败不能永远缓存为“关闭”。本轮仅登记，不顺手修改。[E16、E18]</li>\n<li><strong>上线观测</strong>：按 route/capability 记录 workspace_open、filter_apply、entity_open、command_result、approval_decision、recall_explain，不记录记忆正文/密钥；记录请求耗时、partial 比例、权限拒绝与版本冲突。</li>\n</ul>\n"},{"id":"acceptance","label":"验收清单与判定方法","html":"<h2>12. 验收清单与判定方法</h2>\n<h3>12.1 本轮文档及原型验收（由交付方逐项实际验证）</h3>\n<p>实际验证记录见 <a href=\"./PROTOTYPE-V3-VALIDATION.md\"><code>PROTOTYPE-V3-VALIDATION.md</code></a>；以下复选框保留为待验收模板，不作为本 Markdown 编辑任务的测试通过声明。</p>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> 路由清单中 24 个 page key、66 个页面与 Tab 视图可到达；原型首屏、列表和详情不是同一个模板换标题，功能目标、字段与主操作有区别。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 文档/原型可切换且按原型约定默认回首页；hash 深链刷新和浏览器前进后退可恢复历史 route/对象/Tab，不额外承诺模式间保留当前对象；不以死链接或空白页代替未实现能力说明。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 从 Project → Task → Run → Memory 来源、从 Agent → 资产/空间至少各有一条可回退的关联链；无真实关系时明确不可关联。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 列表搜索/筛选确实改变展示结果；清除恢复，空命中有提示；详情抽屉可连续下探，Esc 关闭且焦点合理返回。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 新建/编辑演示表单有必填校验、取消和成功反馈；批准/拒绝改变演示对象状态，不能重复批准，未调用真实写接口。</li>\n<li><input disabled=\"\" type=\"checkbox\"> accessible、mounted、effective 三层文字与字段同时成立；未运行 Agent 不显示伪造生效证据，Analytics 不展示代码分析替身。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 320/768/1024/1440px、键盘、焦点、错误/空态逐项走查；页面无网络依赖的核心导航可离线使用；旧 <code>product-prototype.html</code> 独立保留原内容与布局，深链/点击/焦点修复另按验证记录核对，不要求与修复前校验值相同。</li>\n<li><input disabled=\"\" type=\"checkbox\"> 文档事实逐项可追源码，建议和目标有标注；原型测试结果另附证据，本文复选框本身不代表已经执行测试。</li>\n</ul>\n<h3>12.2 未来业务实现验收（Given / When / Then）</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>编号</th>\n<th>给定与操作</th>\n<th>必须观察到的结果</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A01</td>\n<td>用户无某私有 Project 权限，打开详情或 overview</td>\n<td>不返回名称、正文、成员或存在性计数，返回可恢复入口</td>\n</tr>\n<tr>\n<td>A02</td>\n<td>Project 的 Knowledge 子系统失败</td>\n<td>仅该区 partial，其他区正常；失败指标不是 0；可局部重试</td>\n</tr>\n<tr>\n<td>A03</td>\n<td>Agent 固定资产已撤权，启动新 Run</td>\n<td>重新授权拒绝该来源，显示未生效原因；历史快照不被当前配置重写</td>\n</tr>\n<tr>\n<td>A04</td>\n<td>两人同时批准同一 pending 请求</td>\n<td>只接受一个有效决策，另一方获冲突；重复请求无重复副作用</td>\n</tr>\n<tr>\n<td>A05</td>\n<td>explicit_only 收到自动提炼，或审批过期</td>\n<td>不写入；不能把审批通过当用户明确编辑指令；理由可审计</td>\n</tr>\n<tr>\n<td>A06</td>\n<td>已批准操作执行失败</td>\n<td>Approval 保留 approved，执行结果显示 failed，可安全重试，不再显示写入成功</td>\n</tr>\n<tr>\n<td>A07</td>\n<td>新旧 Task 状态并存、后台返回未知状态</td>\n<td>legacy 来源可查，未知值只读；前端不发非法状态转换</td>\n</tr>\n<tr>\n<td>A08</td>\n<td>切换 Team/Project 后旧请求迟到</td>\n<td>旧响应不覆盖新上下文，缓存与筛选隔离，URL 与页面一致</td>\n</tr>\n<tr>\n<td>A09</td>\n<td>Run 断流后恢复，或旧 Run 无 snapshot</td>\n<td>新运行按 cursor 补齐且去重；旧运行显示缺证，不拿当前装配补历史</td>\n</tr>\n<tr>\n<td>A10</td>\n<td>Analytics 未启用/未配置/无权/无数据</td>\n<td>四种可观察状态分开；实例范围固定授权；零分母比率显示“—”</td>\n</tr>\n<tr>\n<td>A11</td>\n<td>纠错提交时 expectedVersion 已过期</td>\n<td>返回冲突并保留草稿；旧版本未被覆盖，成功后 lineage 可追</td>\n</tr>\n<tr>\n<td>A12</td>\n<td>旧专业路由迁入新布局</td>\n<td>Wiki 导入/引用、Code 同步/图谱、Skill fork/export、Memory 分层/刷新能力逐项等价</td>\n</tr>\n</tbody></table></div>\n<p>业务切片需实际运行项目已有 typecheck/build、契约/权限/单元测试与浏览器验收；本次仅检查源码与设计文件，不将这些未来命令描述为已通过。\n性能门槛候选：overview 首屏不超过 3 个业务请求、后台聚合不按列表项 N+1、交互反馈不等待完整长任务；精确延迟 SLO 在固定数据量与测试环境评审后确认。</p>\n"},{"id":"references","label":"参考证据、差异更正与待决策","html":"<h2>13. 参考证据、差异更正与待决策</h2>\n<h3>13.1 本轮已检查的源码证据</h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>编号</th>\n<th>本地路径与位置</th>\n<th>可支持的事实（均为静态证据）</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>E1</td>\n<td><code>MemoryPanel/web/src/routes/index.tsx:31–75</code>；<code>constants/menu.tsx:63–86</code></td>\n<td>HashRouter、当前专业路由、隐藏管理入口；无 Analytics 页面路由</td>\n</tr>\n<tr>\n<td>E2</td>\n<td><code>MemoryPanel/web/src/pages/projects/ProjectDetailPage.tsx:1–32,156–160</code></td>\n<td>项目记忆 Tab 仍为骨架，不能宣称项目空间流程可用</td>\n</tr>\n<tr>\n<td>E3</td>\n<td><code>MemoryPanel/web/src/lib/api/projects.ts:8–76</code></td>\n<td>Project CRUD、成员跨 Team 语义、manager/member 及默认 Agent 字段</td>\n</tr>\n<tr>\n<td>E4</td>\n<td><code>MemoryPanel/web/src/pages/team/AgentDetailPage.tsx:1–54</code>；<code>pages/memory-space/MemorySpaceDetailPage.tsx:1–29</code></td>\n<td>Agent 与空间详情明确不接真实数据</td>\n</tr>\n<tr>\n<td>E5</td>\n<td><code>MemoryPanel/web/src/lib/api/assets.ts:70–114</code>；<code>lib/api/agents.ts:45–88,121–199</code></td>\n<td>可访问 client、单项目筛选、固定资产及模板接口；候选权限主体须分辨</td>\n</tr>\n<tr>\n<td>E6</td>\n<td><code>MemoryPanel/web/src/lib/api/tasks.ts:8–24,58–117,151–180</code></td>\n<td>两种旧状态、list 筛选、create 缺 project、声明/实际参与的差别</td>\n</tr>\n<tr>\n<td>E7</td>\n<td><code>MemoryPanel/web/src/pages/team/TeamDetailPage.tsx:24–117</code>；<code>components/AgentTeamPanel.tsx:44–107</code>；<code>components/WriteApprovalPanel.tsx:55–99</code></td>\n<td>八个团队 Tab 已装配，编排成员与审批调用存在</td>\n</tr>\n<tr>\n<td>E8</td>\n<td><code>MemoryPanel/web/src/lib/api/memory.ts:13–32,113–156,160–236</code></td>\n<td>Envelope、简版 Bundle、审批接口、即时评测与 spaceList 的真实边界</td>\n</tr>\n<tr>\n<td>E9</td>\n<td><code>MemoryCore/src/core/record/execution-bundle.ts:1–35</code>；<code>core/record/memory-space.ts:18–105</code></td>\n<td>Bundle 是无 IO 纯函数；Space 身份和默认挂载规则</td>\n</tr>\n<tr>\n<td>E10</td>\n<td><code>MemoryCore/src/core/record/memory-domain.ts:18–65,134–158</code></td>\n<td>domain、四档写策略、显式规则不可被自动总结覆盖、只能收紧</td>\n</tr>\n<tr>\n<td>E11</td>\n<td><code>MemoryPanel/web/src/pages/codeanalysis/CodeAnalysisRepoPage.tsx:15–16,92–113</code></td>\n<td>代码分析详情已内嵌 CodeGraphPage，纠正历史整页孤儿说法</td>\n</tr>\n<tr>\n<td>E12</td>\n<td><code>MemoryPanel/web/src/lib/api/runTraces.ts:8–17</code>；<code>lib/api/types.ts:236–251</code></td>\n<td>RunTrace list/get、摘要/JSON、可选 Task，没有 Project list 筛选</td>\n</tr>\n<tr>\n<td>E13</td>\n<td><code>MemoryPanel/web/src/lib/api/types.ts:254–311</code></td>\n<td>Agent 单 project_id、AssetType 原值、版本/visibility 与现有 injection_mode</td>\n</tr>\n<tr>\n<td>E14</td>\n<td><code>MemoryPanel/web/src/i18n/zh-CN.ts:978–989</code>；<code>MemoryPanel/web/src/pages/memory/ChatMemoryPage/components/useChatMemory.ts:237–282</code>；<code>MemoryPanel/web/src/pages/memory/ChatMemoryPage/components/ChatMemoryPanel.tsx:327–358</code></td>\n<td>L0–L3 名称、时间过滤范围、层查询与分配调用</td>\n</tr>\n<tr>\n<td>E15</td>\n<td><code>MemoryPanel/web/src/index.css:14–85</code></td>\n<td>Tea token 桥接、中性背景、14px 字体和等宽 token</td>\n</tr>\n<tr>\n<td>E16</td>\n<td><code>MemoryPanel/web/src/layouts/ConsoleLayout.tsx:20–43,69–70</code>；<code>stores/backend.ts:212–233</code></td>\n<td>路由前缀识别，任务缓存键和未透传筛选风险</td>\n</tr>\n<tr>\n<td>E17</td>\n<td><code>MemoryPanel/web/src/pages/wiki/WikiPage/components/useWikiSources.ts</code>；<code>pages/code/CodePage/components/useCodeSources.ts:275–395</code>；<code>pages/skills/SkillsPage/components/useSkillsPanel.ts:426–471</code></td>\n<td>专业来源、代码同步/查询/图谱与技能导出/可见性操作存在</td>\n</tr>\n<tr>\n<td>E18</td>\n<td><code>MemoryPanel/web/src/lib/api/analytics.ts:272–302,359–386</code>；<code>services/usePanelCapabilities.ts:26–69</code>；<code>MemoryPanel/src/panel/http/routes/analytics/proxy.ts:24–66</code>；<code>MemoryCore/src/gateway/analytics/analytics-router.ts:123–169</code></td>\n<td>null 比率、实例隔离意图、能力探测、代理和 system_admin 校验</td>\n</tr>\n<tr>\n<td>E19</td>\n<td><code>MemoryPanel/web/src/services/useCurrentRole.ts:1–35</code>；<code>lib/api/permission.ts:105–155</code></td>\n<td>system_admin 全局身份、显式管理权限与团队角色不可混同</td>\n</tr>\n</tbody></table></div>\n<p>表中同一单元格省略前缀的路径，均相对于该单元格首个 <code>MemoryPanel/web/src/</code> 或 <code>MemoryCore/src/</code>；不代表在根目录存在同名文件。</p>\n<h3>13.2 参考材料的采纳方式</h3>\n<ul>\n<li><code>.specs/redesign/00-PROPOSAL.md</code>：采纳“先契约后界面、恢复入口、防假完成”；旧扫描计数、孤儿判定不作为本轮事实。</li>\n<li><code>.specs/redesign-v2/02-TARGET-DOMAIN-AND-CONTRACTS.md</code>、<code>03-CALL-SEQUENCES.md</code>、<code>04-UI-RESTORATION-AND-REDESIGN.md</code>、<code>05-DELIVERY-BACKLOG-AND-ACCEPTANCE.md</code>：继承三层装配、治理、增量迁移；收敛 Tab，修正 explicit_only 和旧状态兼容口径。</li>\n<li><code>.specs/agent-memory-os-ui-v2/CODE-SCAN.md</code>：用于关系基数、读模型与断点定位；本轮对关键点重新看源码，尤其不沿用“没有任何 Bundle resolver”及“CodeGraph 整页未接入”的泛化结论。</li>\n<li><code>/home/malizhi/go/src/goweb_log_collection/client/web/public/docs/product-design.html:280–435</code>：借鉴阅读指南 → 产品全景 → 核心概念 → 架构/时序 → 模块手册 → 原型 → 权限/术语的结构，不复制日志产品的实体或权限。</li>\n<li><code>/home/malizhi/project/intent-os-platform/docs/user-guide.md:141–172</code>：借鉴“使用已有能力 / 创建可复用能力”的双路径；不照搬 Scene → Run 为本产品模型。</li>\n<li><code>/home/malizhi/project/intent-os-platform/docs/planning/77_agent-os-docs-site/01_authoritative.md:71–103</code>：采纳按读者区分指南、概念与开发者资料，以及执行模型/Agent/记忆知识/审批/分层五类概念；不把部署命令塞进业务用户起步路径。</li>\n</ul>\n<h3>13.3 待评审建议，不阻塞本轮设计交付</h3>\n<ol>\n<li><strong>建议</strong>为 owner/manager 增加受限 Analytics 查看权限；当前恢复仍按 system_admin，待独立授权契约和实例隔离测试后再开放。</li>\n<li><strong>建议</strong>后期允许空间策略放宽，但需要专门权限、影响预览、审批与审计；首期仅收紧，不能在原型中暗示已能变更生产策略。</li>\n<li><strong>建议</strong>增加 Agent 多项目差异装配、Skill 版本比较、可视编排；先解决单项目和快照，避免新增 JSON 兜底关系。</li>\n<li><strong>待定</strong>统一记忆中心何时把 ChatMemoryBlock 融入 MemorySpace；在确认数据映射前保留两种视图与来源标记，不移动或删除历史内容。</li>\n<li><strong>待定</strong>审批默认超时、异步导入上限、遥测保留期限、运行事件接入与性能 SLO；均需安全/服务 owner 评审，原型数值不构成生产承诺。</li>\n</ol>\n"},{"id":"chapter-15","label":"常见问题与快速查词","html":"<h2>14. 常见问题与快速查词</h2>\n<h3>为什么能访问资产，Agent 却没有使用它？</h3>\n<p>访问权限只是候选资格。先在 Agent 的能力装配查看固定选择，再进入具体 Run 的生效上下文，检查版本、预算、策略裁剪和注入方式。没有遥测时只显示“未记录”，不能推断模型已经读过正文。</p>\n<h3>任务成功和运行成功有什么区别？</h3>\n<p>Run 记录一次执行尝试；Task 记录业务目标及验收。执行器完成不等于报告可交付，仍需负责人验收；重试保留旧 Run 并创建新的 attempt。</p>\n<h3>L0–L3 和记忆空间是不是一回事？</h3>\n<p>不是。L0 对话原文、L1 原子记忆、L2 场景记忆、L3 核心记忆描述内容层级；MemorySpace 决定归属、范围和写策略。原型“记忆中心 → L0–L3 分层记忆”提供四层入口与 L1 模拟刷新，层级不授予额外权限。</p>\n<h3>遗忘之后，旧报告是否也会被擦除？</h3>\n<p>原型只归档演示条目，使其不再参与后续检索，不重写历史 Run 或报告。正式产品的合规删除必须另行定义源文档、索引、缓存、派生产物和审计保留策略，不能用归档冒充彻底删除。</p>\n<h3>为什么 Analytics 和代码分析分成两页？</h3>\n<p>Analytics 解释线上请求、延迟、Token 和成本；代码分析解释仓库、符号、引用和调用链。二者的数据源、权限与统计口径不同，只在具备真实关联 ID 时互相跳转。</p>\n<h3>原型能直接用于生产吗？</h3>\n<p>不能。所有对象、配置、指标均为演示，角色切换不是认证，模拟审计不是不可篡改账本。刷新恢复演示数据；主题偏好单独保存在浏览器本地。下一阶段按 §11 的契约切片逐项接入并验收。</p>\n<h3>可进一步评审的产品建议</h3>\n<ul>\n<li><strong>证据优先的详情抽屉</strong>：把“结论 → 记忆 → 来源 → Run”放在同一追溯路径；本原型已演示导航，正式接入仍待 provenance 契约。</li>\n<li><strong>下一次运行的影响预览</strong>：装配或策略变更前展示受影响 Agent、空间和来源；不要修改历史 Run。当前只提供策略预览示意，完整差异比较留待后续。</li>\n<li><strong>待办驱动的治理入口</strong>：将需要人工动作的审批、失败和冲突汇总，但保留独立对象类型与解决动作；不再新增含糊的“治理日志”。</li>\n<li>以上是基于本项目材料的设计提议，不是已调研竞品的事实或现有业务能力声明。</li>\n</ul>\n"}];
function href(page,id='',tab='',extra={}){const p=new URLSearchParams({scope:state.scope,role:state.role,...extra});return '#/app/'+page+(id?'/'+encodeURIComponent(id):tab?'/_':'')+(tab?'/'+tab:'')+'?'+p.toString()}
function link(page,text,id='',tab=''){return `<a href="${href(page,id,tab)}">${esc(text)}</a>`}
function badge(text){let cls=/成功|已完成|有效|就绪|已发布|启用|已批准/.test(text)?'green':/审批|复核|待|规划/.test(text)?'warn':/失败|拒绝|取代/.test(text)?'red':'blue';return `<span class="badge ${cls}">${esc(text)}</span>`}
function obj(kind,id){return (data[kind]||[]).find(x=>x.id===id)}
function name(kind,id){return obj(kind,id)?.name||id}
function inspect(kind,id,text){return `<button class="link" data-inspect="${kind}" data-id="${esc(id)}">${esc(text||name(kind,id))}</button>`}
function rowsTable(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}"><div class="empty"><h3>没有匹配结果</h3><p class="muted">尝试清除关键词或调整筛选条件。</p><button data-action="clear-filter">清除筛选</button></div></td></tr>`}</tbody></table></div>`}
function card(title,content,action=''){return `<section class="card"><div class="card-head"><h2>${title}</h2>${action}</div>${content}</section>`}
function kv(entries){return `<dl class="kv">${entries.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`}
function row(title,desc,tail='',icon='↗'){return `<div class="row"><span class="avatar">${icon}</span><div class="row-main">${title}<p>${desc}</p></div>${tail}</div>`}
function notice(text,cls=''){return `<div class="notice ${cls}">${text}</div>`}
function action(label,act,extra=''){return `<button data-action="${act}" ${extra}>${label}</button>`}
function canWrite(){return state.role!=='viewer'}
function writeButton(label,act){return action(label,act,`${canWrite()?'':'disabled title="当前为只读角色"'} class="primary"`)}
function filterBar(options=['进行中','待审批','成功','有效']){return `<form id="filter-form" class="filter"><input aria-label="搜索当前列表" name="q" placeholder="搜索名称、ID 或内容" value="${esc(state.q)}"><select name="filter" aria-label="状态筛选"><option value="all">全部状态</option>${options.map(o=>`<option ${state.filter===o?'selected':''}>${o}</option>`).join('')}</select><button type="submit">筛选</button>${action('清除','clear-filter')}</form>`}
function filtered(items){return items.filter(x=>(!state.q||JSON.stringify(x).toLowerCase().includes(state.q.toLowerCase()))&&(state.filter==='all'||x.status===state.filter))}
function scopeTasks(){return data.tasks.filter(x=>state.scope==='all'||x.project===state.scope)}
function scopeRuns(){return data.runs.filter(x=>scopeTasks().some(t=>t.id===x.task))}
function scopeSpaces(){return data.spaces.filter(x=>state.scope!=='p-onboard'||x.id!=='s-project')}
function scopeMemories(){return data.memories.filter(x=>scopeSpaces().some(s=>s.id===x.space))}
function scopeAssets(){return data.assets.filter(x=>state.scope!=='p-onboard'||x.owner==='TencentDB')}
function scopeApprovals(){return data.approvals.filter(x=>scopeRuns().some(r=>r.id===x.run))}
function tasksTable(items=scopeTasks()){return rowsTable(['任务 / ID','状态','执行 Agent','优先级','项目'],items.map(x=>[`${link('task',x.name,x.id)}<br><span class="mono muted">${x.id}</span>`,badge(x.status),link('agent',x.owner,x.agent),x.priority,link('project',name('projects',x.project),x.project)]))}
function runsTable(items=scopeRuns()){return rowsTable(['执行 / Run ID','状态','Agent','耗时','Token'],items.map(x=>[`${link('run',x.name,x.id)}<br><span class="mono muted">${x.id}</span>`,badge(x.status),link('agent',name('agents',x.agent),x.agent),x.duration,x.tokens]))}
function memoriesTable(items=data.memories){return rowsTable(['记忆内容','领域','空间','状态','来源'],items.map(x=>[`${inspect('memories',x.id)}<br><span class="small muted">${x.version} · ${esc(x.quality)}</span>`,esc(x.domain),link('space',name('spaces',x.space),x.space),badge(x.status),x.source==='manual'?'显式写入':link('run',x.source,x.source)]))}
function assetsTable(items=data.assets){return rowsTable(['资产','类型','版本','状态','操作'],items.map(x=>[link('asset',x.name,x.id),x.type,`<code>${x.version}</code>`,badge(x.status),link(x.type==='Wiki'?'wiki':x.type==='Code'?'code':x.type==='Skill'?'skill':'memory','进入专业工作台',x.type==='Skill'?'sk-pool':'')]))}
function spacesTable(items=data.spaces){return rowsTable(['空间','作用域','写入策略','记忆条数','状态'],items.map(x=>[link('space',x.name,x.id),esc(x.scope),esc(x.policy),String(x.count),badge(x.status)]))}
function paged(items,render){const size=3,total=Math.max(1,Math.ceil(items.length/size)),p=Math.min(state.pageNo,total);return render(items.slice((p-1)*size,p*size))+`<div class="table-footer"><span class="small muted">共 ${items.length} 条 · 第 ${p} / ${total} 页</span><div class="actions">${action('上一页','prev',p<=1?'disabled':'')}${action('下一页','next',p>=total?'disabled':'')}</div></div>`}
function tabs(){const map=tabMap[state.page];if(!map)return '';return `<nav class="tabs" aria-label="页面子导航">${Object.entries(map).map(([k,v])=>`<a href="${href(state.page,state.id,k)}" class="${state.tab===k?'active':''}" ${state.tab===k?'aria-current="page"':''}>${v}</a>`).join('')}</nav>`}
function pageHeader(title,desc,buttons='',tag='目标体验 · 模拟数据'){return `<div class="crumb">TencentDB / ${state.scope==='all'?'全部项目':esc(name('projects',state.scope))} / ${labels[state.page]||''}</div><div class="page-head"><div><h1>${esc(title)}</h1><div class="muted">${desc} <span class="badge">${tag}</span></div></div><div class="actions">${buttons}</div></div>`}
const guidance={home:'先看待办和风险，再进入项目；指标只用于引导行动，不替代真实运行状态。',project:'Project 是协作边界而不是 Team 的简单子目录。任务、Agent、资产、空间及运行在这里聚合，计数必须按调用者权限裁剪。',agent:'可访问代表 ACL 允许；固定装配代表希望随身携带；本轮生效由 Resolver 校验权限、版本、预算后固化到 Run。',task:'任务记录工作目标与验收标准；Run 记录一次执行事实。重试创建新的 attempt，不能覆盖旧的运行证据。',memory:'记忆不是聊天记录的别名。每条记忆都携带范围、来源、版本和生命周期；纠错保留旧版本，遗忘先预览影响。',space:'MemorySpace 是认知隔离边界。挂载不能扩大调用者权限；收紧策略立即生效，放宽策略需重新审批。',governance:'统一待办入口，但审批、审计与评测是不同对象。不能由提出请求的模型批准自己的副作用。',analytics:'恢复蓝图中的线上调用观测。按时间范围统计请求、延迟、Token 和成本；不与代码结构分析混称。',assets:'统一资产目录用于发现和关系管理，Wiki、Code、Skill 的编辑与调试仍进入专属工作台。'};

function parseRoute(){let raw=location.hash.slice(1)||'/docs/start';const [path,query='']=raw.split('?');let parts;try{parts=path.split('/').filter(Boolean).map(decodeURIComponent)}catch{parts=['docs','start']};const p=new URLSearchParams(query);state.mode=parts[0]==='app'?'app':'docs';state.page=parts[1]||(state.mode==='docs'?'start':'home');state.id=parts[2]==='_'?'':parts[2]||'';state.tab=parts[3]||Object.keys(tabMap[state.page]||{})[0]||'';state.scope=['all','p-db','p-onboard'].includes(p.get('scope'))?p.get('scope'):'all';state.role=['viewer','member','manager'].includes(p.get('role'))?p.get('role'):'manager';state.view=p.get('view')||'normal';state.q=p.get('q')||'';state.filter=p.get('filter')||'all';state.pageNo=Math.max(1,Number(p.get('page'))||1)}

function renderNav(){const appGroups=[['工作现场',[['home','⌂'],['projects','▣'],['tasks','☷']]],['执行与协作',[['agents','◇'],['orchestration','⇄'],['runs','▷']]],['知识与记忆',[['memory','◉'],['spaces','▤'],['assets','▧'],['wiki','W'],['code','C'],['analysis','⌘'],['skills','S']]],['治理与组织',[['governance','◷'],['analytics','▥'],['team','♧'],['settings','⚙']]]];const parent={project:'projects',task:'tasks',agent:'agents',space:'spaces',asset:'assets',skill:'skills',run:'runs'};$('#sidebar').innerHTML=state.mode==='docs'?`<div class="nav-group">产品设计 · V3</div>${docsSections.map(s=>`<a href="#/docs/${s.id}" class="${state.page===s.id?'active':''}">${s.label}</a>`).join('')}<div class="nav-foot"><a href="#/app/home">进入交互原型 ↗</a><a href="product-prototype.html">旧版原型 V2 ↗</a><a href="PRODUCT-DESIGN-V3.md">Markdown 详细规格 ↗</a></div>`:appGroups.map(([g,items])=>`<div class="nav-group">${g}</div>${items.map(([p,i])=>`<a href="${href(p)}" class="${(parent[state.page]||state.page)===p?'active':''}"><span class="nav-icon" aria-hidden="true">${i}</span>${labels[p]}</a>`).join('')}`).join('')+'<div class="nav-foot small muted">离线演示 · 无后端连接<br>修改仅在本页内存中有效</div>';$('#mode-docs').classList.toggle('active',state.mode==='docs');$('#mode-app').classList.toggle('active',state.mode==='app')}
function scopeBar(){return `<div class="scope"><span>团队 <b>TencentDB</b></span><span>/</span><select id="scope-select" aria-label="当前项目范围"><option value="all">全部项目</option>${data.projects.map(p=>`<option value="${p.id}" ${state.scope===p.id?'selected':''}>${p.name}</option>`).join('')}</select><span class="badge warn">演示环境</span><span class="right">角色</span><select id="role-select" aria-label="演示角色">${[['manager','管理者'],['member','成员'],['viewer','只读访客']].map(([v,l])=>`<option value="${v}" ${state.role===v?'selected':''}>${l}</option>`).join('')}</select><select id="state-select" aria-label="演示页面状态">${[['normal','正常数据'],['loading','加载中'],['empty','尚无数据'],['error','请求失败'],['denied','无权访问'],['partial','部分失败'],['offline','离线'],['stale','数据过期']].map(([v,l])=>`<option value="${v}" ${state.view===v?'selected':''}>${l}</option>`).join('')}</select></div>`}
function stateSurface(){const x={loading:['正在加载','正在读取工作区数据；不会把加载中计数显示为 0。'],empty:['尚无资源','这是首次使用空态，与没有筛选结果、无权限不同。'],error:['请求失败','演示 requestId: req-demo-503。已保留当前范围与筛选。'],denied:['无权访问','请联系资源管理员申请权限。不会展示对象名称、计数或敏感字段。'],offline:['当前离线','停止提交写入，仅允许恢复连接后重试。']}[state.view];return pageHeader(labels[state.page]||'页面','页面状态演示')+`<div class="empty" role="status"><span class="badge">${esc(state.view)}</span><h2>${x[0]}</h2><p class="muted">${x[1]}</p>${state.view==='loading'?'<div class="skeleton"></div><div class="skeleton" style="max-width:45%"></div>':''}${action(state.view==='error'?'重试（模拟恢复）':'返回正常演示','normal')}</div>`}
function render(){parseRoute();renderNav();$('#sidebar').classList.remove('open');$('#nav-toggle').setAttribute('aria-expanded','false');if(state.mode==='docs'){const s=docsSections.find(d=>d.id===state.page)||docsSections[0];$('#main').innerHTML=`<article class="doc"><div class="eyebrow">PRODUCT DESIGN / V3 · 2026-09-11</div>${s.html}</article>`}else{let content;try{content=['loading','empty','error','denied','offline'].includes(state.view)?stateSurface():renderPage()}catch(e){console.error(e);content='<div class="empty"><h1>页面渲染失败</h1><p>请返回工作台。</p>'+link('home','工作台')+'</div>'}$('#main').innerHTML=scopeBar()+(state.view==='partial'?notice('部分数据加载失败：质量评测依赖暂不可用。其他模块仍可查看；缺失值显示“—”，不伪装为 0。','warn'):'')+(state.view==='stale'?notice('当前为 10 分钟前的快照；写操作已暂停，刷新后可继续。 '+action('刷新快照','normal'),'warn'):'')+content+(state.view==='denied'?'':help());if(state.view==='stale')$('#main').querySelectorAll('[data-action]').forEach(b=>{if(!['normal','clear-filter','prev','next'].includes(b.dataset.action))b.disabled=true})}const params=new URLSearchParams(location.hash.split('?')[1]||'');const detail=params.get('detail');if(detail&&state.mode==='app'&&!['denied','offline','error','loading','empty'].includes(state.view)){const [kind,id]=detail.split(':');showDrawer(kind,id)}else if($('#drawer').open)$('#drawer').close();}

else if(type==='correct'){const m=obj('memories',modalContext.id);if(!m){$('#form-error').textContent='记忆不存在，请关闭后刷新。';return}const old={...m,id:m.id+'-history-'+Date.now(),status:'已取代',quality:'保留旧版本'};data.memories.push(old);m.content=val('content');m.version='v'+((parseInt(m.version.slice(1))||1)+1);m.quality='已纠正 · '+val('reason');obj('spaces',m.space).count++;auditEvent('纠正记忆 '+m.id,val('reason'));msg='演示记忆已生成新版本，旧版已保留。'}
else if(type==='forget'){const m=obj('memories',modalContext.id);if(m){m.status='已归档';auditEvent('归档记忆 '+m.id,val('reason'))}msg='演示记忆已归档；历史来源和 Run 仍可查看。'}
else if(type==='approve'||type==='reject'){if(state.role!=='manager'){toast('仅管理者可以审批');return}const a=obj('approvals',modalContext.id);if(!a||a.status!=='待审批'){$('#form-error').textContent='审批已经结束或版本已变化，请刷新后查看。';return}a.status=type==='approve'?'已批准':'已拒绝';a.decision=val('reason');const r=obj('runs',a.run);r.status=type==='approve'?'运行中':'已拒绝';const t=obj('tasks',r.task);t.status=type==='approve'?'运行中':'待执行';obj('agents',r.agent).status=type==='approve'?'运行中':'就绪';auditEvent(a.status+' '+a.id,val('reason'));msg='演示审批已更新，并已新增审计记录；未执行真实工具。'}
else if(type==='start-run'){const t=obj('tasks',state.id);if(!t){$('#form-error').textContent='任务不可用。';return}const id='run-demo-'+(data.runs.length+1);data.runs.unshift({id,name:t.name+' · 演示执行',task:t.id,agent:t.agent,status:'成功',duration:'1.2 s',tokens:'0',bundle:'bundle-demo-local'});target=href('run',id);msg='演示 Run 已创建；Token 为 0，未调用任何模型。'}
else {auditEvent('预览 '+type,val('reason')||'仅演示，不下发变更');msg=type==='invite'?'已生成邀请预览：'+val('name')+' / '+val('role')+'；未发送通知。':msg}
$('#modal').close();if(target)location.hash=target;else render();toast(msg);}
function recallResult(form){const f=new FormData(form),query=String(f.get('query')||'').trim();if(!query)return;const matches=scopeMemories().filter(m=>m.status==='有效'&&m.space==='s-project').slice(0,Number(f.get('topk')));$('#recall-result').innerHTML=notice('模拟检索：'+esc(query)+' · Top K '+esc(f.get('topk'))+' · Token 预算 '+esc(f.get('budget'))+'。固定演示候选，不执行语义模型。')+rowsTable(['候选','召回路径','排序分（演示）','结果'],matches.map((m,i)=>[inspect('memories',m.id),'向量 + 关键词',String(.91-i*.07),badge('已注入')]).concat([[inspect('memories','m-30'),'关键词','—',badge('过滤：已取代')],[inspect('memories','m-33'),'—','—',badge('过滤：非项目范围')]]))+`<h3 class="space">最终注入预览</h3><pre>${esc(matches.map(m=>'['+m.id+' '+m.version+'] '+m.content).join('\n'))}</pre>`}
function handleAction(act){if(act==='refresh-layer'){layerRefreshed='已模拟刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});render();toast('L1 演示样本已刷新；真实接口仍待恢复验收。');return}if(['create-task','remember','correct','forget','approve','reject','policy','invite','template','key','start-run'].includes(act))return openModal(act);if(act==='clear-filter')return updateQuery({q:null,filter:null,page:null});if(act==='normal')return updateQuery({view:null});if(act==='next'||act==='prev')return updateQuery({page:Math.max(1,state.pageNo+(act==='next'?1:-1))});if(act==='copy-link'){const d=$('#drawer .dialog-body');const old=d.querySelector('#share-link');if(old)old.remove();const p=document.createElement('p');p.id='share-link';p.className='small';p.textContent='选中并复制当前深链（含对象与子页）：';const input=document.createElement('input');input.readOnly=true;input.value=location.href;input.setAttribute('aria-label','当前详情深链');p.appendChild(input);d.appendChild(p);input.focus();input.select();return}if(act==='probe'){if(state.role!=='manager')return toast('只有管理者可以探测配置');return toast('模拟探测完成：3 项能力就绪；没有发送网络请求。')}if(act==='orchestrate'){if(!canWrite())return;location.hash=href('run','run-83');toast('已进入编排示例的主 Run；未触发真实执行。')}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.isComposing||e.keyCode===229))e.preventDefault()});
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();return}const close=e.target.closest('[data-close]');if(close){close.dataset.close==='drawer'?closeDrawer():$('#modal').close();return}const i=e.target.closest('[data-inspect]');if(i){openInspect(i.dataset.inspect,i.dataset.id);return}const a=e.target.closest('[data-action]');if(a&&!a.disabled){handleAction(a.dataset.action);return}const nav=e.target.closest('a[href^="#/app"],a[href^="#/docs"]');if(nav){if($('#modal').open)$('#modal').close();if($('#drawer').open)$('#drawer').close();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='filter-form'){const d=new FormData(f);updateQuery({q:String(d.get('q')||'').trim(),filter:d.get('filter'),page:null})}else if(f.id==='mutation-form')submitMutation(f);else if(f.id==='recall-form')recallResult(f);else if(f.id==='wiki-form')$('#wiki-result').innerHTML=row(inspect('documents','doc-pool','DB-Proxy 运维手册 / §3.2'),'演示命中：连接池上限与变更审批；文档 v8。');else if(f.id==='code-form')$('#code-result').innerHTML=notice('演示回答：超时由 Pool.acquire 的队列等待参数控制。')+row(inspect('symbols','sym-acquire','Pool.acquire · src/pool.ts:42–73'),'固定示例引用；未调用代码问答模型。')});
document.addEventListener('change',e=>{if(e.target.id==='scope-select'){const scope=e.target.value;location.hash=href('home','','',{scope});toast('已切换项目范围，清除原对象和子页上下文。')}else if(e.target.id==='role-select')updateQuery({role:e.target.value,detail:null});else if(e.target.id==='state-select')updateQuery({view:e.target.value,detail:null})});
$('#drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer()});$('#modal').addEventListener('cancel',e=>{e.preventDefault();$('#modal').close()});
$('#nav-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#nav-toggle').setAttribute('aria-expanded',String(open))});
$('#theme').addEventListener('click',()=>{const dark=document.documentElement.classList.toggle('dark');try{localStorage.setItem('memory-design-theme',dark?'dark':'light')}catch{}});
$('#print').addEventListener('click',()=>{if(state.mode!=='docs'){toast('请切换到产品设计文档后打印所需章节。');return}window.print()});
try{document.documentElement.classList.toggle('dark',localStorage.getItem('memory-design-theme')==='dark')}catch{}
window.addEventListener('hashchange',()=>{render();restoreDrawerFocus();window.scrollTo(0,0)});render();

</script></body></html>
