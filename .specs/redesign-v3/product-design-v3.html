<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TencentDB Agent Memory · V3 收敛原型</title><style>:root{--bg:#fff;--s:#fff;--fg:#1f2328;--m:#57606a;--l:#d0d7de;--b:#0969da;--soft:#f6f8fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:56px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--l);font-weight:600;position:sticky;top:0;background:var(--bg)}.mark{background:var(--b);color:#fff;border-radius:6px;padding:4px 8px;margin-right:8px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 56px)}aside{background:var(--soft);border-right:1px solid var(--l);padding:14px 10px}.group{font-size:11px;color:var(--m);font-weight:700;letter-spacing:.08em;margin:16px 8px 6px}a{color:var(--fg);text-decoration:none}.nav{display:block;padding:8px;border-radius:6px}.nav:hover,.nav.active{background:#ddf4ff;color:var(--b)}main{min-width:0;padding:26px;max-width:1400px;width:100%;margin:auto}h1{font-size:28px;margin:0 0 6px}h2{font-size:16px;margin:0 0 10px}.muted{color:var(--m)}.notice,.card{border:1px solid var(--l);border-radius:8px;background:var(--s);padding:14px}.notice{border-left:3px solid var(--b);margin:16px 0}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}.metric{font-size:28px;font-weight:700;margin:8px 0}.kpi{display:block}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--l);margin:18px 0;overflow:auto}.tabs a{padding:8px 10px;white-space:nowrap}.tabs a.active{border-bottom:2px solid var(--b);color:var(--b);font-weight:700}.table{overflow:auto;border:1px solid var(--l);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{background:var(--soft);color:var(--m);font-size:12px}.badge{border:1px solid var(--l);border-radius:999px;padding:2px 7px;font-size:12px;color:var(--m)}.ok{color:#1a7f37}.warn{color:#9a6700}.steps{display:grid;gap:14px}.step{padding-left:34px;position:relative}.step:before{content:counter(item);counter-increment:item;position:absolute;left:0;background:#ddf4ff;color:var(--b);width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px}.steps{counter-reset:item}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:16px}.g4,.two{grid-template-columns:1fr}}</style><body><header class="top"><span class="mark">M</span>TencentDB Agent Memory <span class="muted" style="margin-left:12px">V3 概念收敛原型 · 演示数据</span></header><div class="shell"><aside id="nav"></aside><main id="app"></main></div><script>'use strict';const $=s=>document.querySelector(s);const links=[['工作',[['home','工作台'],['projects','项目'],['tasks','任务'],['runs','运行'],['agents','Agent'],['orchestration','编排']]],['知识与复用',[['library','资源库'],['memory','记忆'],['wiki','Wiki'],['code','Code'],['skills','Skill'],['templates','模板']]],['输入与发布',[['ingestion','导入与分诊'],['changes','变更与发布']]],['组织与平台',[['team','团队'],['settings','平台设置']]]];const go=(r,t='')=>'#/'+r+(t?'/'+t:'');const tab=(r,items)=>'<nav class="tabs">'+items.map(([id,n])=>'<a class="'+(route[1]===id?'active':'')+'" href="'+go(r,id)+'">'+n+'</a>').join('')+'</nav>';let route=[];function render(){route=location.hash.slice(1).split('/').filter(Boolean);let r=route[0]||'home',t=route[1]||'overview';$('#nav').innerHTML=links.map(([g,x])=>'<div class="group">'+g+'</div>'+x.map(([id,n])=>'<a class="nav '+(r===id?'active':'')+'" href="'+go(id)+'">'+n+'</a>').join('')).join('')+'<div class="group">文档</div><a class="nav" href="DOMAIN-MODEL-AND-IA.md">概念与信息架构收敛稿 ↗</a>';let content={home:home,projects:projects,tasks:tasks,runs:runs,agents:agents,library:library,memory:memory,wiki:wiki,code:code,skills:skills,templates:templates,ingestion:ingestion,changes:changes,team:team,settings:settings,orchestration:orchestration}[r];$('#app').innerHTML=content?content(t):home()}function head(x,d){return '<h1>'+x+'</h1><div class="muted">'+d+'</div>'}function table(h,rows){return '<div class="table"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function home(){return head('工作台','只呈现下一步可行动事项；筛选不是授权，Binding 不是筛选。')+'<div class="grid g4" style="margin-top:18px"><a class="card kpi" href="#/tasks">我的 Task<div class="metric">2</div>目标，不是 Run</a><a class="card kpi" href="#/ingestion/triage">待人工分诊<div class="metric">1</div>归属尚未确认</a><a class="card kpi" href="#/changes/review">待审核变更<div class="metric">1</div>内容审核唯一入口</a><a class="card kpi" href="#/runs">等待 RunGate<div class="metric">1</div>仅高风险副作用</a></div><div class="grid two" style="margin-top:16px"><section class="card"><h2>唯一主链</h2><div class="steps"><div class="step"><b>Project → Task → Run</b><br><span class="muted">任务目标与执行尝试分开；Run 固定实际快照。</span></div><div class="step"><b>Import → Triage</b><br><span class="muted">确认归属、Binding 与写目标，不回退到最近项目。</span></div><div class="step"><b>ChangeSet → Review → Publish</b><br><span class="muted">内容候选只走这一条审核与发布链。</span></div></div></section><section class="card"><h2>边界</h2><ul><li>Team–Project 关联不授予项目权限。</li><li>Agent 关联不授予工具、写入或审批权。</li><li>RunGate 与 ChangeSet Review 是两种不同审核。</li></ul></section></div>'}function projects(){return head('项目','Project 是协作与交付现场；Team 是独立多对多协作关系。')+table(['项目','Team','目标','状态'],[['<a href="#/tasks">DB-Proxy 可靠性</a>','TencentDB','降低连接池超时','<span class="badge ok">进行中</span>'],['开发者接入','Developer Experience','维护 SDK 样例','<span class="badge warn">规划中</span>']])}function tasks(){return head('任务','Task 是可验收目标；同一 Task 可以产生多个 Run。')+table(['任务','Project','Agent','状态'],[['定位连接池耗尽原因','DB-Proxy','DBA Assistant','<span class="badge warn">待验收</span>'],['复核慢查询优化建议','DB-Proxy','Query Reviewer','<span class="badge ok">已完成</span>']])}function runs(){return head('运行 Explorer','列表定位执行，详情回溯事件、实际上下文、工具证据与交付。')+table(['Run','Task','状态','Actual snapshot','说明'],[['r-83','定位连接池耗尽原因','<span class="badge warn">等待 RunGate</span>','actual-8f1','副作用尚未执行'],['r-82','复核慢查询优化建议','<span class="badge ok">成功</span>','actual-7b2','Run 成功不等于 Task 已验收']])}function agents(){return head('Agent','独立配置对象；Team/Project 关联不隐含任何权限。')+table(['Agent','Revision','职责','解释'],[['DBA Assistant','r12','异常诊断','accessible ≠ mounted ≠ effective'],['Query Reviewer','r7','只读复核','实际使用以 Run snapshot 为准']])}function library(){return head('资源库','授权后的跨类型发现页；不承担专业编辑，结果跳转专业工作台。')+'<div class="notice">筛选维度固定为 Team、Project、Owner User、明确的 Agent 关系；同维 OR、维间 AND，且先授权再筛选。</div>'+table(['资源','类型','Owner','关联 Agent','状态'],[['生产连接池上限为 200','Memory','林晓','DBA Assistant','<span class="badge ok">已发布</span>'],['DB-Proxy 运维手册','Wiki','林晓','DBA Assistant','<span class="badge ok">已发布</span>'],['db-proxy@c8a71e2','Code','陈宁','Query Reviewer','<span class="badge ok">已索引</span>'],['连接池诊断','Skill','林晓','DBA Assistant','<span class="badge ok">已发布</span>']])}function memory(t){return head('记忆','MemorySpace 是长期归属、ACL 与写策略边界；Task/Run 是上下文和来源，不是长期 owner。')+tab('memory',[['overview','记忆'],['spaces','空间与策略']])+(t==='spaces'?table(['空间','owner','写策略','边界'],[['space-project-db','Project','review_required','项目事实与经验'],['space-team-db','Team','explicit_only','团队方法'],['space-user-lin','User','explicit_only','个人偏好']]):'<div class="notice">长期 owner 仅允许 User / Team / Project / Agent；Task/Run 临时内容使用隔离草稿与来源绑定。</div>')}function specialist(n,d,t){return head(n,d)+tab(route[0],[['overview','概览'],['relations','关系视图']])+'<div class="card">'+t+'</div>'}function wiki(){return specialist('Wiki','同一知识源提供显式链接、向量相似、知识关系三种视图。','相似不等于事实；每条知识关系均回到原文证据。')}function code(){return specialist('Code','所有分析固定在同一 source + revision。','repoId + commit 是代码事实锚点；不跨仓库拼图，不用 latest 回填。')}function skills(){return specialist('Skill','可复用方法需含前置条件、步骤、失败处理与验收。','mounted、loaded、executed、task accepted 是四个不同阶段。')}function templates(){return head('模板','只保留两类模板：AgentTemplate 与 ProcedureTemplate。')+'<div class="notice">Scene / Playbook 合并为 ProcedureTemplate，通过 kind=scene / playbook 区分；不创建第二套运行时。</div>'}function ingestion(t){return head('导入与分诊','候选唯一链路：Import → Triage → ChangeSet。')+tab('ingestion',[['overview','导入'],['triage','分诊'],['quality','质量'],['examples','样例']])+(t==='triage'?table(['输入','证据','建议','状态'],[['Harness 会话摘要','summary-only；缺少 write target','Project / DB-Proxy','<span class="badge warn">待人工分诊</span>'],['metrics.read 调用样例','原始 call + 验收','Example → ChangeSet','<span class="badge ok">可创建变更</span>']]):t==='quality'?'<div class="notice">Quality 只基于传入证据。unknown 不并入失败率；mounted 不等于 executed。</div>':t==='examples'?'<div class="notice">validated_example 需输入、环境、结果与验证证据；否则为 unverified_proposal。</div>':'<div class="steps"><div class="step">接收与脱敏</div><div class="step">去重、coverage 与 lineage</div><div class="step">进入 Triage 确认归属和 Binding</div></div>')}function changes(t){return head('变更与发布','内容变更唯一审核入口；RunGate 不在这里处理。')+tab('changes',[['overview','队列'],['review','审核']])+(t==='review'?'<div class="grid two"><div class="card"><h2>更新连接池诊断 Skill</h2>'+table(['Base','Current','Proposed'],[['v2.1','v2.2','draft-91']])+'<p>locked：生产变更审批步骤。非重叠文本仍须检查来源、ACL、适用范围和语义。</p></div><div class="card"><h2>发布条件</h2><div class="steps"><div class="step">Review 绑定 mergedHash + headRevision</div><div class="step">必需索引 ready</div><div class="step">CAS 发布；旧 Task 不漂移</div></div></div></div>':table(['ChangeSet','目标','状态'],[['更新连接池诊断 Skill','Skill / s-21','<span class="badge warn">待审核</span>'],['沉淀 metrics.read 样例','Memory / project','<span class="badge">草稿</span>']]))}function team(){return head('Team','唯一组织实体，管理成员、协作关系与 Team 级资源入口；不是 Project 权限替代。')+'<div class="notice">TeamMember ≠ ProjectMember；Agent Team 成员身份 ≠ Agent 写入、工具或审批权限。</div>'+table(['主体','类型','Team 角色','项目权限'],[['林晓','User','Manager','p-db manager'],['陈宁','User','Member','p-db / p-sdk member'],['DBA Assistant','Agent','服务成员','不由成员关系派生']])}function settings(){return head('平台设置','用户、Keys、模型、集成；权限、审计、Analytics 仅在 Admin 工具区按角色显示。')+'<div class="notice">创建用户不自动加入 Team 或 Project；服务凭据不继承创建者的私权。</div>'}function orchestration(){return head('编排','管理现有手动/自动触发与 Run 记录；不创建重型 Flow/Scene 引擎。')+'<div class="notice">ProcedureTemplate 可被 Task 引用，但不会赋予 Agent 工具、空间或审批权限。</div>'}window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/home';render();</script></body></html>
