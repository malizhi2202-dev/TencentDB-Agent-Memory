<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TencentDB Agent Memory · 运营原型</title>
  <style>
    :root {
      color-scheme: light;
      --brand-50: #e8f0fe;
      --brand-100: #d2e3fc;
      --brand-600: #1a73e8;
      --brand-700: #0b57d0;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-900: #111827;
      --bg: #ffffff;
      --surface: #ffffff;
      --border: var(--gray-200);
      --control-border: var(--gray-300);
      --fg: var(--gray-900);
      --muted: var(--gray-600);
      --faint: var(--gray-500);
      --accent-bg: #111827;
      --accent-fg: #ffffff;
      --radius: 6px;
      --panel-radius: 10px;
    }
    .dark {
      color-scheme: dark;
      --bg: #000000;
      --surface: #0d0d0d;
      --border: #1f1f1f;
      --control-border: #303030;
      --fg: #f3f4f6;
      --muted: #a1a1aa;
      --faint: #737373;
      --accent-bg: #f3f4f6;
      --accent-fg: #111827;
      --brand-600: #8ab4f8;
      --brand-700: #8ab4f8;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid rgb(107 114 128 / .42); outline-offset: 2px; }
    .topbar {
      position: sticky; top: 0; z-index: 10; height: 56px;
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 600; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 6px; background: var(--accent-bg); color: var(--accent-fg); font: 700 13px/1 ui-monospace, monospace; }
    .brand small { display: block; color: var(--faint); font-size: 11px; font-weight: 500; }
    .top-spacer { flex: 1; }
    .mode-button, .icon-button {
      min-width: 40px; height: 36px; border: 1px solid var(--control-border); border-radius: var(--radius);
      background: var(--surface); color: var(--fg); padding: 0 10px;
    }
    .prototype-tag { border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 56px); }
    .sidebar { padding: 12px 10px 24px; border-right: 1px solid var(--border); background: var(--gray-50); }
    .dark .sidebar { background: #080808; }
    .nav-group { margin: 14px 8px 5px; color: var(--faint); font: 700 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .nav-link { display: flex; min-height: 38px; align-items: center; border-radius: var(--radius); padding: 8px 10px; color: var(--muted); }
    .nav-link:hover { background: var(--gray-100); color: var(--fg); }
    .dark .nav-link:hover { background: #191919; }
    .nav-link.active { background: var(--brand-50); color: var(--brand-700); font-weight: 600; }
    .nav-link .nav-code { margin-left: auto; color: var(--faint); font: 11px ui-monospace, monospace; }
    main { min-width: 0; max-width: 1480px; width: 100%; margin: 0 auto; padding: 26px 28px 50px; }
    .breadcrumb { display: flex; gap: 7px; flex-wrap: wrap; color: var(--faint); font-size: 12px; margin-bottom: 10px; }
    .breadcrumb a { color: var(--brand-700); }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; }
    h2 { margin-bottom: 10px; font-size: 16px; line-height: 1.35; font-weight: 600; letter-spacing: -.015em; }
    h3 { margin-bottom: 4px; font-size: 14px; font-weight: 600; }
    .subhead, .muted { color: var(--muted); }
    .subhead { max-width: 850px; margin: 0; }
    .eyebrow { margin-bottom: 5px; color: var(--brand-700); font: 700 11px/1.3 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .panel { min-width: 0; border: 1px solid var(--border); border-radius: var(--panel-radius); background: var(--surface); }
    .panel-pad { padding: 16px; }
    .notice { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--border); border-left: 3px solid var(--brand-600); border-radius: var(--radius); background: var(--surface); color: var(--muted); }
    .notice strong { color: var(--fg); }
    .grid { display: grid; gap: 14px; }
    .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
    .metric { padding: 15px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin: 6px 0 2px; font-size: 26px; font-weight: 600; letter-spacing: -.03em; }
    .metric-note { color: var(--faint); font-size: 12px; }
    .two-col { grid-template-columns: minmax(0, 1.75fr) minmax(300px, .9fr); }
    .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .section-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 14px 16px 0; }
    .section-head .muted { font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 650px; border-collapse: collapse; }
    th, td { padding: 10px 14px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); background: var(--gray-50); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .dark th { background: #121212; }
    tbody tr:hover { background: var(--gray-50); }
    .dark tbody tr:hover { background: #121212; }
    .row-link { color: var(--brand-700); font-weight: 600; }
    .cell-meta { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .badge.blue { border-color: var(--brand-100); background: var(--brand-50); color: var(--brand-700); }
    .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-600); }
    .tabs { display: flex; gap: 3px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .tab { flex: 0 0 auto; padding: 9px 11px 8px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab:hover { color: var(--fg); background: var(--gray-50); }
    .dark .tab:hover { background: #121212; }
    .tab.active { border-bottom-color: var(--brand-600); color: var(--brand-700); font-weight: 600; }
    .detail-list { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
    .detail-list dt { color: var(--faint); }
    .detail-list dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .relationship { margin-bottom: 16px; }
    .rel-grid { display: grid; grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr) 46px minmax(0, 1fr); align-items: stretch; overflow-x: auto; }
    .rel-node { min-width: 190px; padding: 14px; border: 1px solid var(--border); border-radius: var(--panel-radius); background: var(--surface); }
    .rel-node-title { display: flex; gap: 7px; align-items: center; font-weight: 600; }
    .node-type { color: var(--brand-700); font: 700 10px ui-monospace, monospace; letter-spacing: .08em; }
    .rel-node p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .rel-arrow { display: grid; place-items: center; color: var(--brand-600); font: 700 18px/1 ui-monospace, monospace; }
    .relation-key { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .relation-key strong { color: var(--fg); }
    .map-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: var(--panel-radius); overflow: hidden; }
    .map-col { min-width: 0; padding: 15px; border-right: 1px solid var(--border); }
    .map-col:last-child { border-right: 0; }
    .map-col h3 { color: var(--brand-700); font-size: 12px; }
    .map-col ul { margin: 9px 0 0; padding: 0; list-style: none; }
    .map-col li { padding: 7px 0; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
    .map-col li:first-child { border-top: 0; }
    .rule { font-size: 12px; color: var(--muted); }
    .rule b { color: var(--fg); }
    .scope { display: inline-block; margin: 3px 3px 0 0; padding: 2px 5px; border: 1px solid var(--border); border-radius: 4px; font: 11px ui-monospace, monospace; color: var(--muted); }
    .empty { padding: 34px 16px; text-align: center; color: var(--muted); }
    .route-code { color: var(--faint); font: 12px ui-monospace, monospace; white-space: nowrap; }
    .placeholder { max-width: 720px; }
    .footer-note { margin-top: 16px; color: var(--faint); font-size: 12px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .prototype-button { min-height: 34px; padding: 7px 11px; border: 1px solid var(--control-border); border-radius: var(--radius); background: var(--surface); color: var(--fg); }
    .prototype-button.primary { border-color: var(--brand-600); background: var(--brand-600); color: #fff; }
    .prototype-button[disabled] { cursor: not-allowed; opacity: .58; }
    .permission-cell { min-width: 220px; }
    .permission-cell .scope { margin-bottom: 3px; }
    .callout { padding: 10px 12px; border: 1px dashed var(--control-border); border-radius: var(--radius); color: var(--muted); background: var(--gray-50); }
    .dark .callout { background: #121212; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
    .field { display: grid; gap: 5px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input, .field select { width: 100%; min-height: 36px; padding: 7px 9px; border: 1px solid var(--control-border); border-radius: var(--radius); background: var(--surface); color: var(--fg); }
    .field.full { grid-column: 1 / -1; }
    .secret-mask { letter-spacing: .12em; color: var(--faint); }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 180px minmax(0, 1fr); }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col, .three-col { grid-template-columns: 1fr; }
      .map-columns { grid-template-columns: 1fr; }
      .map-col { border-right: 0; border-bottom: 1px solid var(--border); }
      .map-col:last-child { border-bottom: 0; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 12px; }
      .brand small, .prototype-tag { display: none; }
      .shell { display: block; }
      .sidebar { display: flex; gap: 2px; overflow-x: auto; padding: 7px 10px; border-right: 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
      .nav-group { display: none; }
      .nav-link { flex: 0 0 auto; min-height: 36px; padding: 7px 9px; }
      .nav-link .nav-code { display: none; }
      main { padding: 20px 14px 36px; }
      .page-head { display: block; }
      h1 { font-size: 24px; }
      .metrics { grid-template-columns: 1fr 1fr; gap: 9px; }
      .metric { padding: 12px; }
      .metric-value { font-size: 22px; }
      .rel-grid { grid-template-columns: minmax(180px, 1fr); gap: 8px; }
      .rel-arrow { height: 23px; transform: rotate(90deg); }
      .relation-key { grid-template-columns: 1fr; }
      .detail-list { grid-template-columns: 96px minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" data-route="#/home" aria-label="返回主页">
      <span class="brand-mark">TD</span>
      <span>TencentDB Agent Memory<small>日常运营工作台</small></span>
    </a>
    <span class="top-spacer"></span>
    <span class="prototype-tag">样例数据 · 离线原型</span>
    <button class="mode-button" id="theme-toggle" type="button" aria-label="切换深色模式">深色</button>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="nav-group">日常运营</div>
      <a class="nav-link" href="#/home" data-route="#/home">主页 <span class="nav-code">H</span></a>
      <a class="nav-link" href="#/projects" data-route="#/projects">项目 <span class="nav-code">P</span></a>
      <a class="nav-link" href="#/tasks" data-route="#/tasks">任务 <span class="nav-code">T</span></a>
      <a class="nav-link" href="#/agents" data-route="#/agents">智能体 <span class="nav-code">A</span></a>
      <div class="nav-group">知识与交付</div>
      <a class="nav-link" href="#/memory/browse/spaces" data-route="#/memory/browse/spaces">记忆</a>
      <a class="nav-link" href="#/wiki" data-route="#/wiki">Wiki</a>
      <a class="nav-link" href="#/code" data-route="#/code">代码</a>
      <a class="nav-link" href="#/skills" data-route="#/skills">技能</a>
      <a class="nav-link" href="#/templates" data-route="#/templates">模板与流程库</a>
      <a class="nav-link" href="#/ingestion/triage" data-route="#/ingestion/triage">内容接入与分流</a>
      <a class="nav-link" href="#/changes" data-route="#/changes">内容变更与发布</a>
      <div class="nav-group">组织与配置</div>
      <a class="nav-link" href="#/teams" data-route="#/teams">团队</a>
      <a class="nav-link" href="#/users" data-route="#/users">用户</a>
      <a class="nav-link" href="#/model-config" data-route="#/model-config">模型配置</a>
    </aside>
    <main id="app" tabindex="-1" aria-live="polite"></main>
  </div>

  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      const themeToggle = document.getElementById('theme-toggle');
      const defaultRoute = '#/home';
      const navRoutes = {
        '#/home': '主页', '#/projects': '项目', '#/tasks': '任务', '#/agents': '智能体',
        '#/memory/browse/spaces': '记忆', '#/wiki': 'Wiki', '#/code': '代码', '#/skills': '技能',
        '#/templates': '模板与流程库', '#/ingestion/triage': '内容接入与分流', '#/changes': '内容变更与发布', '#/teams': '团队', '#/users': '用户', '#/users/create': '创建用户', '#/model-config': '模型配置'
      };
      const projectTabs = [
        ['overview', '概览'], ['tasks', '任务'], ['agents', '智能体'], ['members', '成员'], ['access', '访问与边界']
      ];
      const teamTabs = [
        ['overview', '概览'], ['agents', '智能体'], ['tasks', '任务'], ['members', '成员'], ['projects', '关联项目'], ['permissions', '资源权限']
      ];
      const agentTabs = [
        ['overview', '概览'], ['system-prompt', '系统提示词'], ['runtime-parameters', '运行参数'], ['tools', '工具'], ['skills', '技能'], ['hooks', 'Hooks'], ['memory', '记忆'], ['resources', '资源授权'], ['vault', 'Vault'], ['scheduled-tasks', '定时任务']
      ];
      const taskTabs = [['overview', '概览'], ['runs', '运行记录']];

      function link(route, label, className = '') {
        return `<a class="${className}" href="${route}" data-route="${route}">${label}</a>`;
      }
      function badge(text, variant = '') { return `<span class="badge ${variant}">${text}</span>`; }
      function button(label, disabled = true, variant = '') { return `<button class="prototype-button ${variant}" type="button"${disabled ? ' disabled aria-disabled="true"' : ''}>${label}</button>`; }
      function breadcrumb(items) {
        return `<nav class="breadcrumb" aria-label="面包屑">${items.map((item, i) => i === items.length - 1 ? `<span>${item.label}</span>` : `${link(item.route, item.label)}<span>/</span>`).join('')}</nav>`;
      }
      function tabs(items, active, base) {
        return `<nav class="tabs" aria-label="页面标签">${items.map(([id, label]) => link(`${base}/${id}`, label, `tab ${id === active ? 'active' : ''}`)).join('')}</nav>`;
      }
      function pageHead(eyebrow, title, subtitle, route) {
        return `${breadcrumb([{ route: '#/home', label: '主页' }, { label: title }])}<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subhead">${subtitle}</p></div><span class="route-code">${route}</span></div>`;
      }
      function relationshipMap() {
        return `<section class="panel relationship" aria-labelledby="relationship-title">
          <div class="section-head"><div><h2 id="relationship-title">关系与权限地图</h2><div class="muted">关系确定归属与范围；对 Memory、Wiki、代码、技能的操作仍逐项由成员资源权限裁定。</div></div>${badge('样例关系', 'blue')}</div>
          <div class="panel-pad"><div class="rel-grid">
            <article class="rel-node"><div class="rel-node-title"><span class="node-type">TEAM</span> 数据库平台组</div><p>创建者可创建团队。团队拥有项目（1:N），每个项目只能关联一个团队。</p></article>
            <div class="rel-arrow" aria-hidden="true">1:N →</div>
            <article class="rel-node"><div class="rel-node-title"><span class="node-type">PROJECT</span> 数据库内核演进</div><p>唯一归属数据库平台组；项目成员仅在被授予的资源类型上执行 CRUD。</p></article>
            <div class="rel-arrow" aria-hidden="true">关联 →</div>
            <article class="rel-node"><div class="rel-node-title"><span class="node-type">AGENT</span> Retriever</div><p>可公开，也可关联多个团队和项目；关联授予查看/使用，不授予关系、策略或配置变更。</p></article>
          </div></div>
          <div class="relation-key"><span><strong>Team → Project：</strong>Team owns Project 1:N；一个 Project 恰好属于一个 Team。</span><span><strong>资源所有权：</strong>User、Team、Project 各自拥有唯一作用域的 Memory / Wiki / 代码 / 技能 / 模板；公开 Wiki / 技能 / 模板仅为平台目录，Memory 永不公开。</span></div>
        </section>`;
      }
      function home() {
        return `${pageHead('日常运营', '主页', '数据库平台组的样例工作面：项目、任务、智能体与知识流转均为可点击的离线原型。', '#/home')}
          <div class="notice"><strong>运营规则已加载。</strong> 团队拥有项目（1:N），且每个项目只关联一个团队。<strong>open</strong> 仅开放项目上下文；User、Team、Project 分别拥有唯一作用域的 Memory、Wiki、代码、技能和模板。公开 Wiki / 技能 / 模板仅来自平台目录，Memory 永不公开；成员操作仍取决于被分配的资源权限。智能体关联允许在关联内使用和查看能力，关联本身不允许改动关联、策略或配置。</div>
          <section class="grid metrics" aria-label="运营摘要">
            <article class="panel metric"><div class="metric-label">进行中项目</div><div class="metric-value">12</div><div class="metric-note">数据库平台组拥有 4 个</div></article>
            <article class="panel metric"><div class="metric-label">待处理任务</div><div class="metric-value">38</div><div class="metric-note">7 项需要人工确认</div></article>
            <article class="panel metric"><div class="metric-label">已关联智能体</div><div class="metric-value">9</div><div class="metric-note">能力使用与查看受边界控制</div></article>
            <article class="panel metric"><div class="metric-label">接入待分流</div><div class="metric-value">6</div><div class="metric-note">最近一次样例同步：09:30</div></article>
          </section>
          <div class="grid two-col">
            <section class="panel"><div class="section-head"><h2>重点项目</h2>${link('#/projects', '查看项目', 'row-link')}</div><div class="table-wrap"><table><thead><tr><th>项目</th><th>可见性</th><th>归属团队</th><th>今日</th></tr></thead><tbody>
              <tr><td>${link('#/project/p-db/overview', '数据库内核演进', 'row-link')}<span class="cell-meta">p-db</span></td><td>${badge('open', 'blue')}</td><td>${link('#/team/team-db/overview', '数据库平台组')}</td><td>${link('#/project/p-db/tasks', '4 个进行中')}</td></tr>
              <tr><td>${link('#/project/p-observability/overview', '观测性基线', 'row-link')}<span class="cell-meta">p-observability</span></td><td>${badge('team')}</td><td>数据库平台组</td><td>2 个进行中</td></tr>

      }
      function changeReview() {
        return `${breadcrumb([{ route: '#/home', label: '主页' }, { route: '#/changes', label: '内容变更与发布' }, { label: 'CS-28' }])}<div class="page-head"><div><div class="eyebrow">CHANGE SET · CS-28</div><h1>调整索引检索策略</h1><p class="subhead">Project p-db 作用域的 ChangeSet 审阅与发布样例；本页不提供提交或写入操作。</p></div><span class="route-code">#/changes/review/cs-28</span></div><section class="panel panel-pad"><h2>影响边界</h2><div class="callout">资源 Owner：Project <code>p-db</code>。本变更仅适用于 p-db 自有代码 / Policy；不修改 User、Team 或其他 Project 资源，且不携带 Memory 内容。</div><div class="map-columns"><div class="map-col"><h3>关联不变</h3><ul><li>Agent-Team / Agent-Project 不改动</li><li>use / view 语义不变</li><li>Memory 永不公开</li></ul></div><div class="map-col"><h3>策略变更</h3><ul><li>index-readonly 候选修订</li><li>需 p-db 获授权审阅者</li><li>不跨资源 Owner 生效</li></ul></div><div class="map-col"><h3>运行影响</h3><ul><li>RunGate 继续逐次核验</li><li>Resource ACL 保持收窄</li><li>仅 p-db 作用域</li></ul></div></div></section>`;
      }
      function placeholder(label, route) {
        const descriptions = {
          '记忆空间': 'Memory 仅属于 User、Team 或 Project 的唯一私有作用域，永不公开。此入口应按当前获授权 Owner 过滤，不会作为公共目录展示。',
          'Wiki': 'Wiki 可属于 User、Team 或 Project 的唯一作用域；另有平台-owned 的可选公共 Wiki 目录。公共目录不改变私有 Wiki 的所有权与权限。',
          '代码': '代码仅属于 User、Team 或 Project 的唯一作用域；此入口应按 Owner 和资源 ACL 过滤，不提供公共代码空间。',
          '技能': '技能可属于 User、Team 或 Project 的唯一作用域；平台-owned 公共技能目录仅供可选引用，不转移私有技能所有权。',
          '模板与流程库': '模板与流程库包含智能体模板与流程模板；它们可属于 User、Team 或 Project 的唯一作用域，平台-owned 公共目录仅供可选引用，不转移私有模板与流程的所有权。'
        };
        const description = descriptions[label] || '此日常运营入口在离线原型中保留为可导航的样例上下文。';
        return `${pageHead('工作台', label, description, route)}<section class="panel panel-pad placeholder"><h2>${label}样例视图</h2><p class="muted">${description}</p><p>${link('#/home', '返回主页', 'row-link')}</p></section>`;
      }
      function render() {
        const route = location.hash || defaultRoute;
        let html;
        if (route === '#/home') html = home();
        else if (route === '#/projects') html = projects();
        else if (route === '#/teams') html = teams();
        else if (/^#\/project\/p-db(?:\/(overview|tasks|agents|members|access))?$/.test(route)) html = project(route.match(/^#\/project\/p-db(?:\/(overview|tasks|agents|members|access))?$/));
        else if (/^#\/project\/(p-observability|p-gateway)\/overview$/.test(route)) html = placeholder('项目概览', route);
        else if (route === '#/tasks') html = tasks();
        else if (/^#\/task\/t-104(?:\/(overview|runs|run\/[^/]+))?$/.test(route)) html = task(route.match(/^#\/task\/t-104(?:\/(overview|runs|run\/[^/]+))?$/));
        else if (/^#\/task\/t-107\/overview$/.test(route)) html = placeholder('任务概览', route);
        else if (route === '#/agents') html = agents();
        else if (/^#\/agent\/a-retriever(?:\/(overview|system-prompt|runtime-parameters|tools|skills|hooks|memory|resources|vault|scheduled-tasks))?$/.test(route)) html = agent(route.match(/^#\/agent\/a-retriever(?:\/(overview|system-prompt|runtime-parameters|tools|skills|hooks|memory|resources|vault|scheduled-tasks))?$/));
        else if (route === '#/users') html = users();
        else if (route === '#/users/create') html = userCreate();
        else if (route === '#/model-config') html = modelConfig();
        else if (route === '#/memory/browse/spaces') html = placeholder('记忆空间', route);
        else if (route === '#/ingestion/triage') html = ingestion();
        else if (route === '#/changes') html = changes();
        else if (route === '#/changes/review/cs-28') html = changeReview();
        else if (/^#\/team\/team-db(?:\/(overview|agents|tasks|members|projects|permissions))?$/.test(route)) html = team(route.match(/^#\/team\/team-db(?:\/(overview|agents|tasks|members|projects|permissions))?$/));
        else if (['#/wiki', '#/code', '#/skills', '#/templates'].includes(route)) html = placeholder(navRoutes[route], route);
        else html = `${pageHead('未找到', '未找到该页面', '此离线原型未定义该路由。请从日常导航返回已定义的页面。', route)}<section class="panel empty">${link('#/home', '返回主页', 'row-link')}</section>`;
        app.innerHTML = html;
        document.querySelectorAll('.nav-link').forEach((node) => {
          const navRoute = node.dataset.route;
          const active = route === navRoute || (navRoute === '#/projects' && route.startsWith('#/project/')) || (navRoute === '#/teams' && route.startsWith('#/team/')) || (navRoute === '#/tasks' && route.startsWith('#/task/')) || (navRoute === '#/agents' && route.startsWith('#/agent/')) || (navRoute === '#/changes' && route.startsWith('#/changes/')) || (navRoute === '#/users' && route.startsWith('#/users'));
          node.classList.toggle('active', active);
        });
        app.focus({ preventScroll: true });
      }
      function updateTheme() {
        const dark = document.documentElement.classList.contains('dark');
        themeToggle.textContent = dark ? '浅色' : '深色';
        themeToggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      }
      const savedTheme = localStorage.getItem('tdam-theme');
      if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      updateTheme();
      themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('tdam-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        updateTheme();
      });
      window.addEventListener('hashchange', render);
      if (!location.hash) location.hash = defaultRoute;
      else render();
    })();
  </script>
</body>
</html>
